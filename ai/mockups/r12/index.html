<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pixel Wall</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="kit.css">
<script src="icons.js"></script>
<script src="shared.js"></script>
<script src="kit.js"></script>
<style>
/* The Wall, round 12: a compact fleet row, a toolbar to filter and sort, runs as tiles or a list. Opening a run docks it. */
.wallv { padding-bottom: 96px; }
.dock { display: none; }
body.docked .wallv { display: none; }
body.docked .dock { display: grid; grid-template-columns: 280px minmax(0, 1fr); gap: 12px; height: calc(100dvh - 60px - env(safe-area-inset-top, 0px)); padding-block: 8px 16px; }
.rail { overflow-y: auto; display: flex; flex-direction: column; gap: 6px; padding: 1px 4px 40px 1px; scrollbar-width: thin; }
.rail h3 { margin: 14px 4px 4px; font: 500 12.5px var(--sans); color: var(--ink-3); display: flex; gap: 8px; }
.rail .fsearch { width: 100%; margin-bottom: 4px; }
.dock .detail { border: 1px solid var(--line-2); border-radius: 16px; overflow: hidden; }
.pagev { display: none; padding-bottom: 64px; }
body.page .wallv, body.page .dock { display: none; }
body.page .pagev { display: block; }
.back { display: none; }
@media (max-width: 1280px) { .hero { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); grid-template-rows: 220px auto; } .h-side { grid-column: 1 / -1; grid-template-columns: repeat(4, minmax(0, 1fr)); grid-template-rows: 112px; } }
@media (max-width: 900px) { body.docked .dock { grid-template-columns: minmax(0, 1fr); } .rail { display: none; } .back { display: inline-flex; } .lrow { grid-template-columns: 10px minmax(0, 1fr) auto auto; } .lrow .s, .lrow .m { display: none; } .hero { grid-template-columns: minmax(0, 1fr); grid-template-rows: 220px 240px auto; } .trow { grid-template-columns: 24px 10px minmax(0, 1fr) auto; } .trow .tw, .trow .sevs, .trow .tm, .trow .m, .trow .ta { display: none; } .thead { display: none; } }
@media (max-width: 640px) { .gut { padding-left: 16px; padding-right: 16px; } .h-side { grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-rows: repeat(2, 108px); } .search span, .search kbd { display: none; } .search { width: 34px; padding: 0; justify-content: center; } .top { flex-wrap: wrap; height: auto; row-gap: 4px; padding-block: 10px 6px; } .nav { order: 3; width: 100%; } .tile { min-height: 0; } .tb-r { width: 100%; } .tb-r .fsearch { flex: 1; } .tb-r .sel { display: none; } }
</style>

<header class="top gut">
  <div class="brand" id="brand"></div>
  <nav class="nav" id="nav" aria-label="Pages"></nav>
  <div class="right">
    <button class="search" id="search" aria-label="Search and commands"></button>
    <button class="btn icon ghost" id="since" data-act="catchup" aria-label="Since you last looked" title="Since you last looked"></button>
    <button class="btn icon ghost" id="theme" data-act="theme" aria-label="Switch light or dark" title="Light or dark"></button>
    <button class="btn primary" id="newrun"></button>
  </div>
</header>
<main class="wallv gut" id="wallv">
  <div class="hero" id="hero"></div>
  <div class="toolbar" id="toolbar" role="toolbar" aria-label="Filter and sort runs"></div>
  <div id="wall-body"></div>
</main>
<main class="dock gut" id="dock">
  <aside class="rail" id="rail" aria-label="Runs"></aside>
  <section class="detail" id="detail" aria-label="Run"></section>
</main>
<main class="pagev gut" id="pagev"></main>
<div class="bulk" id="bulk" role="region" aria-label="Selected runs"></div>
<script src="hero.js"></script>
<script>
(function () {
  "use strict";
  const { runs, find, name, isLive, on, fmt } = PX;
  const TI = K.TI;
  const load = (k, d) => { try { return JSON.parse(localStorage.getItem("pixel-r12-" + k)) ?? d; } catch { return d; } };
  const save = (k, v) => { try { localStorage.setItem("pixel-r12-" + k, JSON.stringify(v)); } catch {} };
  const st = { view: "wall", run: null, tab: "overview", mode: "text", file: null, sel: null,
    filter: load("filter", "all"), q: "", rq: "", model: "", sort: load("sort", "started"), layout: load("layout", "tiles"), picked: new Set() };
  const PAGES = ["Runs", "Findings", "Activity", "Models", "Stats", "Knowledge", "Templates", "Settings"];
  const $ = (s) => document.querySelector(s);
  $("#brand").innerHTML = K.brand + "Pixel";
  $("#search").innerHTML = `${TI("search", "sm")}<span>Search</span><kbd>${TI("command")}</kbd><kbd>K</kbd>`;
  $("#since").innerHTML = TI("history", "sm");
  $("#newrun").innerHTML = `${TI("plus", "sm")}New run`;
  const themeIcon = () => ($("#theme").innerHTML = TI(document.documentElement.getAttribute("data-theme") === "light" ? "moon" : "sun", "sm"));
  themeIcon();

  /* ---------- which runs to show ---------- */
  const open = (r) => K.findingsOf(r.id).some((f) => !f.verdict);
  const FILTERS = [
    ["all", "All", () => true],
    ["running", "Running", (r) => isLive(r) && !r.question],
    ["needs", "Needs you", (r) => PX.needsYou(r) || r.status === "recovering"],
    ["triage", "To triage", open],
    ["finished", "Finished", (r) => ["done", "triaged"].includes(r.status)],
  ];
  const cat = (id) => FILTERS.find((f) => f[0] === id)[2];
  const textMatch = (r, q) => !q || `${name(r)} ${r.repo} ${r.template}`.toLowerCase().includes(q.toLowerCase());
  const SORTS = { started: ["Started", (a, b) => a.started - b.started], activity: ["Activity", (a, b) => (b.tps || 0) - (a.tps || 0) || a.started - b.started], cost: ["Cost", (a, b) => b.cost - a.cost], name: ["Name", (a, b) => name(a).localeCompare(name(b))] };
  const shown = () => runs.filter(cat(st.filter)).filter((r) => textMatch(r, st.q) && (!st.model || r.model === st.model)).sort(SORTS[st.sort][1]);
  const onWall = (r) => isLive(r) || ["failed", "stopped", "paused"].includes(r.status);
  const finished = (r) => ["done", "triaged"].includes(r.status);

  function nav() {
    const cur = st.view === "wall" || st.view === "run" ? "Runs" : st.view;
    const n = K.untriaged().length;
    const needs = runs.filter(PX.needsYou).length;
    $("#nav").innerHTML = PAGES.map((p) => `<button type="button" data-page="${p}" ${p === cur ? 'aria-current="page"' : ""}>${p}${p === "Findings" && n ? `<span class="n">${n}</span>` : ""}${p === "Runs" && needs ? `<span class="n warn" title="${needs} need you">${needs}</span>` : ""}</button>`).join("");
    $("#since").classList.toggle("dotted", K.catchup().runs.length > 0);
  }
  function toolbar() {
    const models = [...new Set(runs.map((r) => r.model))];
    const segs = FILTERS.map(([id, l, f]) => { const n = runs.filter(f).length; return `<button type="button" role="tab" data-filter="${id}" aria-selected="${st.filter === id}" ${id === "needs" && n ? 'data-warn="1"' : ""}>${l}<span>${n}</span></button>`; }).join("");
    return `<div class="segf" role="tablist" aria-label="Show">${segs}</div>
      <div class="tb-r">
        <label class="fsearch">${TI("search", "sm")}<input id="q" type="search" placeholder="Filter" value="${fmt.esc(st.q)}" aria-label="Filter runs by name, repo or template" autocomplete="off"><kbd>/</kbd></label>
        <span class="sel">${TI("brain", "sm")}<select id="model" aria-label="Model"><option value="">All models</option>${models.map((m) => `<option value="${m}" ${st.model === m ? "selected" : ""}>${fmt.shortModel(m).replace(/^claude-/, "")}</option>`).join("")}</select></span>
        <span class="sel">${TI("arrow-down", "sm")}<select id="sort" aria-label="Sort by">${Object.entries(SORTS).map(([k, [l]]) => `<option value="${k}" ${st.sort === k ? "selected" : ""}>${l}</option>`).join("")}</select></span>
        <div class="seg" role="group" aria-label="Layout"><button type="button" data-layout="tiles" aria-pressed="${st.layout === "tiles"}" title="Tiles">${TI("layout-grid", "sm")}</button><button type="button" data-layout="list" aria-pressed="${st.layout === "list"}" title="List">${TI("list-details", "sm")}</button></div>
      </div>`;
  }
  const empty = () => `<div class="nothing">${TI("filter-off", "sm")}Nothing matches. <button type="button" class="lnk" data-clear="1">Clear filters</button></div>`;
  function wallBody() {
    const list = shown();
    if (!list.length) return empty();
    let html = "";
    if (st.layout === "list") {
      const all = list.every((r) => st.picked.has(r.id));
      html = `<div class="table" role="table"><div class="thead" role="row"><label class="ck"><input type="checkbox" data-pick-all="1" ${all ? "checked" : ""} aria-label="Select all"></label><span></span><span>Run</span><span>Status</span><span>Output</span><span>Findings</span><span>Model</span><span class="m">tok/s</span><span class="m">Cost</span><span class="m">Runtime</span><span></span></div>${list.map((r) => K.trow(r, st.picked.has(r.id))).join("")}</div>`;
    } else {
      const live = list.filter(onWall), fin = list.filter(finished);
      if (live.length) html += `<div class="tiles" id="tiles">${live.map((r) => K.tile(r, { sel: st.sel === r.id })).join("")}</div>`;
      if (fin.length) html += `<div class="sec-t"><h2>Finished</h2><span>${fin.length}</span></div><div class="list" id="finished">${fin.map((r) => K.lrow(r, false)).join("")}</div>`;
    }
    if (st.filter === "triage") html += `<div class="sec-t"><h2>Findings to triage</h2><span>${K.untriaged().length}</span></div>${K.findingsTable(null, { openOnly: true })}`;
    return html;
  }
  function bulk() {
    const n = st.picked.size, b = $("#bulk");
    b.classList.toggle("on", n > 0 && st.view === "wall" && st.layout === "list");
    if (!n) return;
    b.innerHTML = `<span><b>${n}</b> selected</span><button type="button" class="btn sm ghost" data-bulk="pause">${TI("player-pause", "sm")}Pause</button><button type="button" class="btn sm ghost" data-bulk="resume">${TI("player-play", "sm")}Resume</button><button type="button" class="btn sm ghost" data-bulk="message">${TI("message", "sm")}Message</button><button type="button" class="btn sm ghost danger" data-bulk="stop">${TI("player-stop", "sm")}Stop</button><button type="button" class="btn sm icon ghost" data-bulk="clear" aria-label="Clear selection" title="Clear selection">${TI("x", "sm")}</button>`;
  }

  function keep(fn) {
    const vals = {};
    document.querySelectorAll("main input[id], main textarea[id]").forEach((el) => (vals[el.id] = el.value));
    const ae = document.activeElement;
    const caret = ae && ae.id && typeof ae.selectionStart === "number" ? ae.selectionStart : null;
    const focus = ae?.id || (ae?.classList?.contains("tile") ? "tile:" + ae.dataset.run : null);
    const db = $("#detail .db"), top = db ? db.scrollTop : 0, rail = $("#rail").scrollTop;
    fn();
    for (const [id, v] of Object.entries(vals)) { const el = document.getElementById(id); if (el && !["q", "rq"].includes(id)) el.value = v; }
    const nb = $("#detail .db"); if (nb && db) nb.scrollTop = top;
    $("#rail").scrollTop = rail;
    if (focus?.startsWith("tile:")) document.querySelector(`.tile[data-run="${focus.slice(5)}"]`)?.focus({ preventScroll: true });
    else if (focus) { const el = document.getElementById(focus); if (el) { el.focus({ preventScroll: true }); if (caret != null) try { el.setSelectionRange(caret, caret); } catch {} } }
  }

  function render() {
    keep(() => {
      document.body.classList.toggle("docked", st.view === "run");
      document.body.classList.toggle("page", !["wall", "run"].includes(st.view));
      nav();
      if (st.view === "wall") {
        $("#toolbar").innerHTML = toolbar();
        $("#wall-body").innerHTML = wallBody();
      } else if (st.view === "run") {
        const r = find(st.run);
        if (!r) { st.view = "wall"; return render(); }
        const list = runs.filter((x) => textMatch(x, st.rq)).sort((a, b) => a.started - b.started);
        const w = list.filter(onWall), f = list.filter(finished);
        $("#rail").innerHTML = `<label class="fsearch">${TI("search", "sm")}<input id="rq" type="search" placeholder="Filter" value="${fmt.esc(st.rq)}" aria-label="Filter runs" autocomplete="off"></label>${w.length ? `<h3>Live <span>${w.length}</span></h3>${w.map((x) => K.mini(x, x.id === r.id)).join("")}` : ""}${f.length ? `<h3>Finished <span>${f.length}</span></h3>${f.map((x) => K.mini(x, x.id === r.id)).join("")}` : ""}`;
        $("#detail").innerHTML = K.detail(r, st, { close: true });
        $("#detail .dh-top").insertAdjacentHTML("afterbegin", `<button type="button" class="btn sm icon back" data-act="close" aria-label="Back to the wall">${TI("arrow-left", "sm")}</button>`);
      } else if (st.view === "Findings") {
        $("#pagev").innerHTML = `<div class="ph"><h1>Findings</h1><span>${K.untriaged().length} to triage</span></div>${K.findingsTable(null)}`;
      } else {
        $("#pagev").innerHTML = `<div class="ph"><h1>${st.view}</h1></div><div class="blank">${st.view} isn't part of this mockup.</div>`;
      }
      bulk();
    });
  }

  function openRun(id, o = {}) {
    const fresh = st.run !== id || st.view !== "run";
    st.tab = o.tab || (fresh ? "overview" : st.tab);
    st.view = "run"; st.run = st.sel = id; st.file = o.file || null;
    const r = find(id);
    if (r && r.unseen && st.tab === "overview") setTimeout(() => PX.act(id, "seen"), 4000);
    render();
    try { history.replaceState(null, "", "#" + id); } catch {}
    window.scrollTo(0, 0);
  }
  function close() { const id = st.run; st.view = "wall"; st.run = null; render(); try { history.replaceState(null, "", location.pathname); } catch {} document.querySelector(`.tile[data-run="${id}"]`)?.focus({ preventScroll: true }); }
  function openPage(p) { if (p === "Runs") return close(); st.view = p; st.run = null; render(); window.scrollTo(0, 0); }
  function newRun(pre = {}) {
    const d = K.dialog(`<h2>New run</h2>${PX.newRunForm(pre)}`, "New run");
    PX.bindNewRun(d.el.querySelector("form"), (id) => { d.close(); openRun(id); }, d.close);
    d.el.querySelector("#nr-repo").focus();
  }
  function openFinding(id) {
    const f = K.fById(id);
    const d = K.dialog(`<div style="margin:-22px -24px">${K.findingCard(f)}</div>`, f.title);
    on("change", (e) => { if (e.finding === id && document.body.contains(d.el)) d.el.querySelector(".card-dlg").innerHTML = `<div style="margin:-22px -24px">${K.findingCard(f)}</div>`; });
  }
  function message(id) { if (st.view !== "run" || st.run !== id) openRun(id); document.getElementById("compose-" + id)?.focus(); }
  function setFilter(f) { st.filter = f; save("filter", f); st.view = "wall"; st.run = null; render(); document.getElementById("toolbar").scrollIntoView({ block: "start", behavior: "smooth" }); }
  function bulkMessage(ids) {
    const d = K.dialog(`<h2>Message ${ids.length} runs</h2><form class="bulk-msg"><textarea id="bulk-text" rows="4" placeholder="Sent to each run's main agent" aria-label="Message"></textarea><div class="row"><span class="chips">${ids.map((id) => `<span class="pill">${K.chip(find(id))}${fmt.esc(name(find(id)))}</span>`).join("")}</span><button type="submit" class="btn primary">Send</button></div></form>`, "Message runs");
    d.el.querySelector("form").addEventListener("submit", (e) => { e.preventDefault(); const t = d.el.querySelector("textarea").value.trim(); if (!t) return; ids.forEach((id) => PX.message(id, t)); d.close(); PX.toast(`Sent to ${ids.length} runs`); });
    d.el.querySelector("textarea").focus();
  }

  PX.ui = {
    openRun, newRun, close, openPage, openFinding, message, setFilter,
    current: () => st.run || st.sel,
    setTab: (t) => { st.tab = t; render(); $("#detail .db").scrollTop = 0; },
    setMode: (m) => { st.mode = m; render(); },
    openFile: (p) => { st.file = p; render(); },
    rename: (id) => { if (st.view !== "run" || st.run !== id) openRun(id); K.rename(id, $("#detail h1")); },
    catchup: () => K.dialog(K.catchupHTML(), "Since you last looked"),
  };

  document.addEventListener("click", (e) => {
    const p = e.target.closest("[data-page]");
    if (p) return openPage(p.dataset.page);
    const f = e.target.closest("[data-filter]");
    if (f) return setFilter(f.dataset.filter);
    const l = e.target.closest("[data-layout]");
    if (l) { st.layout = l.dataset.layout; save("layout", st.layout); return render(); }
    if (e.target.closest("[data-clear]")) { st.filter = "all"; st.q = ""; st.model = ""; save("filter", "all"); return render(); }
    const b = e.target.closest("[data-bulk]");
    if (b) {
      const ids = [...st.picked], a = b.dataset.bulk;
      if (a === "clear") { st.picked.clear(); return render(); }
      if (a === "message") return bulkMessage(ids);
      ids.forEach((id) => { const r = find(id); if ((a === "pause" || a === "stop") && isLive(r)) PX.act(id, a); if (a === "resume" && ["paused", "stopped"].includes(r.status)) PX.act(id, a); });
      st.picked.clear(); return render();
    }
    if (e.target.closest("button, a, input, textarea, select, label, form.t-body, .x-menu")) return;
    const t = e.target.closest(".tile, .lrow, .trow");
    if (t) openRun(t.dataset.run);
  });
  document.addEventListener("change", (e) => {
    if (e.target.id === "model") { st.model = e.target.value; render(); }
    if (e.target.id === "sort") { st.sort = e.target.value; save("sort", st.sort); render(); }
    const pk = e.target.closest("[data-pick]");
    if (pk) { pk.checked ? st.picked.add(pk.dataset.pick) : st.picked.delete(pk.dataset.pick); render(); }
    if (e.target.closest("[data-pick-all]")) { const ids = shown().map((r) => r.id); if (e.target.checked) ids.forEach((id) => st.picked.add(id)); else st.picked.clear(); render(); }
  });
  document.addEventListener("input", (e) => {
    if (e.target.id === "q") { st.q = e.target.value; render(); }
    if (e.target.id === "rq") { st.rq = e.target.value; render(); }
  });
  $("#search").addEventListener("click", PX.palette);
  $("#newrun").addEventListener("click", () => newRun());

  const cols = () => { const ts = [...document.querySelectorAll("#tiles .tile")]; if (ts.length < 2) return 1; const y = ts[0].offsetTop; return ts.filter((t) => t.offsetTop === y).length; };
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && st.view === "run" && !document.querySelector(".x-pal, .scrim-c, .x-menu, .x-dialog-scrim") && !e.target.closest("input, textarea")) { e.preventDefault(); return close(); }
    if (e.key === "Escape" && e.target.id === "q") { st.q = ""; e.target.blur(); return render(); }
    if (!K.plainKey(e) || document.querySelector(".scrim-c")) return;
    if (e.key === "/") { e.preventDefault(); const q = $(st.view === "run" ? "#rq" : "#q"); q?.focus(); q?.select(); return; }
    if (st.view === "wall" && /^[1-5]$/.test(e.key)) { e.preventDefault(); return setFilter(FILTERS[+e.key - 1][0]); }
    const list = st.view === "run" ? [...document.querySelectorAll("#rail .tile")] : [...document.querySelectorAll("#tiles .tile, #finished .lrow, .trow")];
    const ids = list.map((x) => x.dataset.run);
    let i = ids.indexOf(st.view === "run" ? st.run : st.sel ?? document.activeElement?.dataset?.run);
    const step = { ArrowRight: 1, ArrowLeft: -1, ArrowDown: st.view === "run" || st.layout === "list" ? 1 : cols(), ArrowUp: st.view === "run" || st.layout === "list" ? -1 : -cols(), j: 1, k: -1 }[e.key];
    if (step && ["wall", "run"].includes(st.view) && ids.length) {
      e.preventDefault();
      i = Math.max(0, Math.min(ids.length - 1, i < 0 ? 0 : i + step));
      if (st.view === "run") openRun(ids[i], { tab: st.tab });
      else { st.sel = ids[i]; list.forEach((t) => t.setAttribute("aria-selected", t.dataset.run === st.sel)); list[i].focus(); }
      return;
    }
    if (e.key === "x" && st.view === "wall" && st.layout === "list" && st.sel) { e.preventDefault(); st.picked.has(st.sel) ? st.picked.delete(st.sel) : st.picked.add(st.sel); return render(); }
    if (e.key === "Enter" && st.view === "wall" && st.sel) { e.preventDefault(); return openRun(st.sel); }
    if (e.key === "m") { const id = st.run || st.sel; if (id) { e.preventDefault(); message(id); } return; }
    if (e.key === "n") { e.preventDefault(); return newRun(); }
    if (e.key === "f") { e.preventDefault(); return openPage("Findings"); }
  });

  on("tick", (ev) => {
    if (st.view === "wall") {
      const el = document.querySelector(`#tiles .tile[data-run="${ev.run}"]`);
      if (el) K.patchTile(el, find(ev.run));
    } else if (st.view === "run") {
      const m = document.querySelector(`#rail .tile[data-run="${ev.run}"]`);
      if (m) m.outerHTML = K.mini(find(ev.run), ev.run === st.run);
      const ag = document.querySelector('#detail [data-slot="agents"]');
      if (ag && ev.run === st.run) ag.innerHTML = K.agentsCard(find(st.run));
    }
  });
  on("rates", () => {
    if (st.view !== "wall") return;
    document.querySelectorAll("#tiles .tile").forEach((el) => K.patchTile(el, find(el.dataset.run)));
    document.querySelectorAll(".trow").forEach((el) => { const w = el.querySelector(".tw"); const r = find(el.dataset.run); if (w && isLive(r)) w.innerHTML = K.wave(r, 160, 24); });
  });
  on("change", render);
  on("minute", render);
  on("theme", () => { themeIcon(); render(); });

  addEventListener("hashchange", () => { const x = location.hash.slice(1); if (x && find(x)) openRun(x); else if (x === "findings") openPage("Findings"); });
  const h = location.hash.slice(1);
  if (h === "findings") st.view = "Findings";
  else if (h === "list") st.layout = "list";
  else if (h.startsWith("filter-")) st.filter = h.slice(7);
  else if (h && find(h)) { st.view = "run"; st.run = st.sel = h; }
  render();
  PX.start();
})();
</script>
