<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Pixel · C Wall</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fragment+Mono&family=Schibsted+Grotesk:wght@400;500;600;700&display=swap">
<script src="shared.js"></script>
<style>
/* Layout: a wall of live run tiles, each streaming its last tool calls; fleet throughput as one stacked
   band above; finished runs as a list below; a run opens as a sheet from the right. */
:root {
  --wall: #e7e9ec; --tile: #ffffff; --tile-2: #f5f6f8; --hover: #eff1f4; --line: #dbdee3; --line-2: #eaecef;
  --ink: #101216; --ink-2: #535966; --ink-3: #868c97;
  --accent: #2545e8; --accent-bg: #e8ecfd;
  --ok: #16864a; --ok-bg: #e3f3e9; --warn: #a85f00; --warn-bg: #fbf0dc; --bad: #c43434; --bad-bg: #fae8e8; --info: #2b5fca; --info-bg: #e6edfb;
  --k-shell: #0d8f80; --k-read: #a3a8b2; --k-edit: #2f6fe0; --k-task: #7c4fd8; --k-web: #cf5f18; --k-bad: #c43434;
  --r0: #0d8f80; --r1: #2f6fe0; --r2: #7c4fd8; --r3: #d23f8c; --r4: #4f9512; --r5: #d9631b;
  --shadow: 0 1px 2px rgba(16, 18, 22, .06), 0 0 0 1px rgba(16, 18, 22, .05);
  --lift: 0 8px 24px rgba(16, 18, 22, .1), 0 0 0 1px rgba(16, 18, 22, .07);
  --pop: 0 24px 64px rgba(16, 18, 22, .22), 0 0 0 1px rgba(16, 18, 22, .06);
  --sans: "Schibsted Grotesk", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "Fragment Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --wall: #0b0c0e; --tile: #15171a; --tile-2: #1a1c20; --hover: #1f2126; --line: #2a2d33; --line-2: #212328;
    --ink: #eceef1; --ink-2: #a9aeb8; --ink-3: #6f7580;
    --accent: #8ba0ff; --accent-bg: rgba(139, 160, 255, .14);
    --ok: #4fc68a; --ok-bg: rgba(79, 198, 138, .13); --warn: #e8a948; --warn-bg: rgba(232, 169, 72, .13); --bad: #ef6b6b; --bad-bg: rgba(239, 107, 107, .13); --info: #7aa3ff; --info-bg: rgba(122, 163, 255, .13);
    --k-shell: #36c2b0; --k-read: #5a606b; --k-edit: #6ea2ff; --k-task: #a58bfa; --k-web: #f0a35e; --k-bad: #ef6b6b;
    --r0: #36c2b0; --r1: #6ea2ff; --r2: #a58bfa; --r3: #f07fb6; --r4: #9fd456; --r5: #f0a35e;
    --shadow: 0 0 0 1px rgba(255, 255, 255, .06); --lift: 0 8px 24px rgba(0, 0, 0, .5), 0 0 0 1px rgba(255, 255, 255, .1); --pop: 0 24px 64px rgba(0, 0, 0, .6), 0 0 0 1px rgba(255, 255, 255, .08);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --wall: #0b0c0e; --tile: #15171a; --tile-2: #1a1c20; --hover: #1f2126; --line: #2a2d33; --line-2: #212328;
  --ink: #eceef1; --ink-2: #a9aeb8; --ink-3: #6f7580;
  --accent: #8ba0ff; --accent-bg: rgba(139, 160, 255, .14);
  --ok: #4fc68a; --ok-bg: rgba(79, 198, 138, .13); --warn: #e8a948; --warn-bg: rgba(232, 169, 72, .13); --bad: #ef6b6b; --bad-bg: rgba(239, 107, 107, .13); --info: #7aa3ff; --info-bg: rgba(122, 163, 255, .13);
  --k-shell: #36c2b0; --k-read: #5a606b; --k-edit: #6ea2ff; --k-task: #a58bfa; --k-web: #f0a35e; --k-bad: #ef6b6b;
  --r0: #36c2b0; --r1: #6ea2ff; --r2: #a58bfa; --r3: #f07fb6; --r4: #9fd456; --r5: #f0a35e;
  --shadow: 0 0 0 1px rgba(255, 255, 255, .06); --lift: 0 8px 24px rgba(0, 0, 0, .5), 0 0 0 1px rgba(255, 255, 255, .1); --pop: 0 24px 64px rgba(0, 0, 0, .6), 0 0 0 1px rgba(255, 255, 255, .08);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--wall); color: var(--ink); font: 14px/1.5 var(--sans); -webkit-font-smoothing: antialiased; min-height: 100%; }
body.locked { overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
code, kbd, .mono { font-family: var(--mono); }
kbd { font: 11px var(--mono); color: var(--ink-3); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; background: var(--tile); }
svg.i { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.gut { padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); }

/* top */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: flex; align-items: center; gap: 28px; height: 60px; background: color-mix(in srgb, var(--wall) 88%, transparent); backdrop-filter: blur(10px); }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 17px; letter-spacing: -.02em; flex: none; }
.brand svg { width: 20px; height: 20px; }
.nav { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; min-width: 0; }
.nav button { border: 0; background: none; padding: 6px 11px; border-radius: 999px; color: var(--ink-2); font-weight: 500; white-space: nowrap; }
.nav button:hover { color: var(--ink); background: var(--hover); }
.nav button[aria-current="page"] { background: var(--ink); color: var(--tile); }
.top .right { margin-left: auto; display: flex; gap: 8px; align-items: center; flex: none; }
.search { display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 10px 0 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--tile); color: var(--ink-3); width: 260px; text-align: left; }
.search span { flex: 1; }
.btn { display: inline-flex; align-items: center; gap: 7px; height: 36px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--tile); font-weight: 600; font-size: 13.5px; white-space: nowrap; }
.btn:hover { border-color: var(--ink-3); }
.btn.primary, .x-primary { background: var(--ink); color: var(--tile); border-color: var(--ink); }
.btn.primary:hover { opacity: .9; }
.btn.sm { height: 30px; padding: 0 11px; font-size: 13px; border-radius: 8px; }
.btn.icon { width: 36px; padding: 0; justify-content: center; }
.btn.sm.icon { width: 30px; }
.btn.danger { color: var(--bad); }

/* fleet band */
.fleet { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 14px 32px; align-items: end; padding-top: 18px; padding-bottom: 6px; }
.counts { display: flex; flex-wrap: wrap; gap: 8px; }
.count { display: inline-flex; align-items: center; gap: 8px; height: 34px; padding: 0 14px; border-radius: 999px; background: var(--tile); box-shadow: var(--shadow); font-weight: 500; border: 0; }
.count b { font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums; }
.count.warn { background: var(--warn-bg); color: var(--warn); box-shadow: none; }
.count.warn b { color: var(--warn); }
.nums { display: flex; gap: 28px; }
.num { display: flex; flex-direction: column; }
.num b { font-size: 22px; font-weight: 600; letter-spacing: -.02em; font-variant-numeric: tabular-nums; line-height: 1.15; }
.num b small { font-size: 14px; font-weight: 500; color: var(--ink-3); margin-left: 4px; }
.num span { font-size: 12.5px; color: var(--ink-3); }
.flow { grid-column: 1 / -1; }
.flow-chart { position: relative; height: 56px; border-bottom: 1px solid var(--line); }
.flow-chart svg { display: block; }
.flow-axis { display: flex; justify-content: space-between; font: 11px var(--mono); color: var(--ink-3); padding-top: 4px; }
.flow-legend { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 12.5px; color: var(--ink-2); padding-top: 2px; }
.flow-legend span { display: inline-flex; align-items: center; gap: 6px; }
.flow-legend i { width: 9px; height: 9px; border-radius: 3px; }
.flow-legend em { font: normal 12px var(--mono); color: var(--ink-3); font-variant-numeric: tabular-nums; }

/* tiles */
.sec-t { display: flex; align-items: baseline; gap: 10px; margin: 26px 0 12px; }
.sec-t h2 { margin: 0; font-size: 15px; font-weight: 600; }
.sec-t span { color: var(--ink-3); font-size: 13px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 380px), 1fr)); gap: 14px; }
.tile { display: flex; flex-direction: column; background: var(--tile); border-radius: 16px; box-shadow: var(--shadow); overflow: hidden; cursor: pointer; transition: box-shadow .15s, transform .15s; min-width: 0; }
.tile:hover { box-shadow: var(--lift); }
.t-h { display: flex; align-items: center; gap: 10px; padding: 14px 16px 0; min-width: 0; }
.chip { width: 11px; height: 11px; border-radius: 3px; flex: none; }
.t-name { border: 0; background: none; padding: 0; font-weight: 600; font-size: 16px; letter-spacing: -.01em; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.t-name:hover { text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; }
.unseen { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); flex: none; }
.t-st { margin-left: auto; display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; font-weight: 500; color: var(--ink-2); flex: none; }
.t-st[data-s="running"] { color: var(--ok); } .t-st[data-s="asking"], .t-st[data-s="recovering"], .t-st[data-s="preparing"] { color: var(--warn); } .t-st[data-s="failed"] { color: var(--bad); }
.t-meta { padding: 2px 16px 0 37px; font: 12px var(--mono); color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.t-body { margin: 12px 0 0; border-top: 1px solid var(--line-2); border-bottom: 1px solid var(--line-2); background: var(--tile-2); height: 128px; overflow: hidden; position: relative; }
.log { list-style: none; margin: 0; padding: 10px 16px; display: flex; flex-direction: column; justify-content: flex-end; height: 100%; gap: 1px; }
.log li { display: grid; grid-template-columns: 58px 46px minmax(0, 1fr); gap: 8px; font: 12px/1.6 var(--mono); white-space: nowrap; }
.log li .who { color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; }
.log li .cmd { overflow: hidden; text-overflow: ellipsis; color: var(--ink-2); }
.log li:nth-last-child(n+2) { opacity: .62; } .log li:nth-last-child(n+3) { opacity: .42; } .log li:nth-last-child(n+4) { opacity: .26; } .log li:nth-last-child(n+5) { opacity: .14; }
.log li:last-child .cmd { color: var(--ink); }
.log li.in { animation: rise .35s ease-out; }
@keyframes rise { from { transform: translateY(8px); opacity: 0; } }
.t-body.ask { background: var(--warn-bg); height: auto; min-height: 128px; padding: 12px 16px 14px; display: flex; flex-direction: column; gap: 10px; }
.t-body.ask p { margin: 0; font-size: 14px; line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.t-body.ask .lab { font-size: 12.5px; font-weight: 600; color: var(--warn); }
.t-body .x-ask-opts { display: flex; flex-wrap: wrap; gap: 6px; }
.t-body.note { padding: 14px 16px; font-size: 13.5px; display: flex; flex-direction: column; gap: 10px; }
.t-body.note.warn { background: var(--warn-bg); } .t-body.note.bad { background: var(--bad-bg); }
.attempts { display: flex; gap: 4px; align-items: center; font-size: 12px; color: var(--ink-3); }
.attempts i { width: 22px; height: 5px; border-radius: 3px; background: var(--line); }
.attempts i.on { background: var(--warn); }
.attempts i.cur { background: var(--warn); animation: blink 1.2s ease-in-out infinite; }
@keyframes blink { 50% { opacity: .35; } }
.t-prog { padding: 11px 16px 0; font-size: 13.5px; line-height: 1.45; display: flex; gap: 8px; align-items: baseline; min-height: 44px; }
.t-prog .lab { flex: none; font-size: 11.5px; font-weight: 600; padding: 1px 7px; border-radius: 5px; background: var(--tile-2); color: var(--ink-2); }
.t-prog .lab.found { background: var(--ok-bg); color: var(--ok); }
.t-prog .tx { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-width: 0; flex: 1; }
.t-prog .tx code { font-size: 12px; }
.t-prog .d { flex: none; font: 12px var(--mono); color: var(--accent); }
.t-f { margin-top: auto; display: flex; align-items: center; gap: 14px; padding: 10px 16px 14px; font: 12px var(--mono); color: var(--ink-3); font-variant-numeric: tabular-nums; }
.t-f .bc { flex: 1; min-width: 0; display: flex; }
.t-f .bc svg { width: 100%; height: 20px; }
.t-f b { color: var(--ink); font-weight: 400; }
.ag { display: inline-flex; gap: 3px; align-items: center; }
.ag i { width: 8px; height: 8px; border-radius: 2px; background: var(--line); }
.ag i[data-s="running"] { background: var(--ok); }
.ag i[data-s="waiting"] { box-shadow: inset 0 0 0 1.5px var(--ok); background: none; }
.ag i[data-s="interrupted"], .ag i[data-s="idle"], .ag i[data-s="starting"] { background: var(--warn); }

.x-dot { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--ink-3); display: inline-block; }
.x-dot[data-s="running"] { background: var(--ok); }
.x-dot[data-s="asking"], .x-dot[data-s="recovering"], .x-dot[data-s="preparing"] { background: var(--warn); }
.x-dot[data-s="failed"] { background: var(--bad); }
.x-dot[data-s="paused"], .x-dot[data-s="stopped"] { background: none; box-shadow: inset 0 0 0 1.5px var(--ink-3); }
.x-dot[data-s="done"] { background: var(--info); }
.x-dot[data-s="triaged"] { background: none; box-shadow: inset 0 0 0 1.5px var(--info); }

/* finished list */
.list { background: var(--tile); border-radius: 16px; box-shadow: var(--shadow); overflow: hidden; margin-bottom: 72px; }
.lrow { display: grid; grid-template-columns: 11px minmax(140px, 1.1fr) minmax(0, 1fr) minmax(0, 1.4fr) 76px 70px 96px; gap: 14px; align-items: center; padding: 12px 16px; border-top: 1px solid var(--line-2); cursor: pointer; }
.lrow:first-child { border-top: 0; }
.lrow:hover { background: var(--hover); }
.lrow .n { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; border: 0; background: none; padding: 0; text-align: left; }
.lrow .rp { font: 12px var(--mono); color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lrow .s { font-size: 13px; color: var(--ink-2); display: flex; align-items: center; gap: 8px; min-width: 0; }
.lrow .s span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lrow .m { font: 12.5px var(--mono); color: var(--ink-2); text-align: right; font-variant-numeric: tabular-nums; }
.lrow .btn { justify-self: end; }

/* sheet */
.scrim { position: fixed; inset: 0; z-index: 50; background: rgba(12, 14, 18, .28); opacity: 0; transition: opacity .2s; }
.scrim.on { opacity: 1; }
.sheet { position: fixed; z-index: 60; top: 0; right: 0; bottom: 0; width: min(1140px, calc(100vw - 40px)); background: var(--tile); box-shadow: var(--pop); display: flex; flex-direction: column; transform: translateX(104%); transition: transform .26s cubic-bezier(.2, .8, .2, 1); border-radius: 18px 0 0 18px; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
.sheet.on { transform: none; }
.sh { padding: 18px 28px 0 28px; display: flex; flex-direction: column; gap: 6px; }
.sh-top { display: flex; align-items: center; gap: 12px; min-width: 0; }
.sh-top h1 { margin: 0; font-size: 24px; font-weight: 700; letter-spacing: -.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; cursor: text; }
.sh-top .chip { width: 14px; height: 14px; border-radius: 4px; }
.sh-top .acts { margin-left: auto; display: flex; gap: 6px; flex: none; }
.pill { display: inline-flex; align-items: center; gap: 7px; height: 26px; padding: 0 11px; border-radius: 999px; font-size: 12.5px; font-weight: 600; background: var(--tile-2); color: var(--ink-2); flex: none; }
.pill[data-s="running"] { background: var(--ok-bg); color: var(--ok); } .pill[data-s="asking"], .pill[data-s="recovering"], .pill[data-s="preparing"] { background: var(--warn-bg); color: var(--warn); } .pill[data-s="failed"] { background: var(--bad-bg); color: var(--bad); } .pill[data-s="done"], .pill[data-s="triaged"] { background: var(--info-bg); color: var(--info); }
.sh-meta { display: flex; flex-wrap: wrap; gap: 4px 14px; font: 12.5px var(--mono); color: var(--ink-3); padding-left: 26px; }
.sh-meta a { color: var(--ink-2); text-decoration: none; }
.sh-meta a:hover { color: var(--accent); }
.notice { margin: 6px 0 0 26px; padding: 9px 12px; border-radius: 10px; font-size: 13.5px; background: var(--warn-bg); }
.notice.bad { background: var(--bad-bg); }
.facts { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 0 26px; padding: 0; }
.facts > div { background: var(--tile-2); border-radius: 10px; padding: 7px 12px; min-width: 0; }
.facts dt { font-size: 11.5px; color: var(--ink-3); }
.facts dd { margin: 0; font: 13px var(--mono); display: flex; gap: 6px; align-items: center; white-space: nowrap; font-variant-numeric: tabular-nums; }
.facts dd small { font: 12px var(--sans); color: var(--ink-3); }
.fact-btn { border: 0; background: none; padding: 0; font: inherit; display: inline-flex; align-items: center; gap: 4px; }
.fact-btn:hover { color: var(--accent); }
.fact-btn svg.i { width: 12px; height: 12px; }
.tabs { display: flex; gap: 4px; padding: 14px 28px 0 54px; border-bottom: 1px solid var(--line-2); overflow-x: auto; scrollbar-width: none; }
.tabs button { border: 0; background: none; padding: 7px 12px; margin-bottom: 8px; border-radius: 999px; color: var(--ink-2); font-weight: 500; white-space: nowrap; font-size: 13.5px; }
.tabs button:hover { background: var(--hover); color: var(--ink); }
.tabs button[aria-selected="true"] { background: var(--ink); color: var(--tile); }
.tabs .badge { margin-left: 5px; color: var(--warn); }
.sb { flex: 1; min-height: 0; overflow-y: auto; }
.pad { padding: 22px 28px 40px 54px; }
.ov { display: grid; grid-template-columns: minmax(0, 1fr) minmax(280px, 360px); gap: 36px; padding: 22px 28px 40px 54px; }
.ov-main, .ov-side { display: flex; flex-direction: column; gap: 26px; min-width: 0; }
.sec-h { display: flex; align-items: center; gap: 10px; margin: 0 0 10px; }
.sec-h h2 { margin: 0; font-size: 15px; font-weight: 600; }
.sec-h .meta { font-size: 12.5px; color: var(--ink-3); }
.sec-h .right { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.delta { font: 12px var(--mono); color: var(--accent); }
.seg { display: inline-flex; padding: 3px; border-radius: 999px; background: var(--tile-2); }
.seg button { border: 0; background: none; height: 24px; padding: 0 10px; border-radius: 999px; font-size: 12.5px; color: var(--ink-2); font-weight: 500; }
.seg button[aria-pressed="true"] { background: var(--tile); color: var(--ink); box-shadow: var(--shadow); }
.side-card { background: var(--tile-2); border-radius: 14px; padding: 14px 16px; }
.compose { padding: 12px 28px 16px 54px; border-top: 1px solid var(--line-2); }
.cbox { display: flex; gap: 8px; align-items: flex-end; border: 1px solid var(--line); border-radius: 14px; padding: 7px 7px 7px 14px; background: var(--tile); }
.cbox:focus-within { border-color: var(--ink-3); }
.cbox textarea { flex: 1; border: 0; outline: 0; resize: none; background: none; min-height: 34px; max-height: 160px; padding: 7px 0; }
.cbox .btn { height: 34px; }

/* shared content */
.x-md { max-width: 70ch; font-size: 15px; line-height: 1.6; }
.x-md h2 { font-size: 20px; margin: 0 0 8px; letter-spacing: -.01em; }
.x-md h3 { font-size: 12.5px; font-weight: 600; color: var(--ink-3); margin: 20px 0 6px; }
.x-md h3:first-child { margin-top: 0; }
.x-md ul { margin: 0; padding-left: 18px; }
.x-md li { margin: 3px 0; }
.x-md li::marker { color: var(--ink-3); }
.x-md p { margin: 0 0 8px; }
.x-md code { font-size: .84em; background: var(--tile-2); padding: 1px 5px; border-radius: 5px; }
.x-md li.new { background: var(--accent-bg); border-radius: 5px; box-shadow: -8px 0 0 var(--accent-bg), 6px 0 0 var(--accent-bg); }
.x-md.changes li, .x-md.changes h3 { opacity: .5; }
.x-md.changes .add, .x-md.changes .del { opacity: 1; }
.x-md.changes li.add { background: var(--ok-bg); border-radius: 5px; box-shadow: -8px 0 0 var(--ok-bg); }

.x-form-btns, .x-dialog-btns { display: flex; justify-content: flex-end; gap: 8px; }

.x-menu-item:disabled { opacity: .45; cursor: default; background: none; }
.x-menu-item.danger { color: var(--bad); }
.x-menu-check { color: var(--accent); font-size: 12px; }

.x-menu-head { padding: 6px 10px 4px 28px; font-size: 12px; color: var(--ink-3); }
.x-pal, .x-dialog-scrim { position: fixed; inset: 0; z-index: 850; background: rgba(12, 14, 18, .32); display: flex; justify-content: center; align-items: flex-start; padding: 12vh 16px 0; }
.x-pal-box { width: min(620px, 100%); background: var(--tile); border-radius: 18px; box-shadow: var(--pop); overflow: hidden; }

.x-pal-list { max-height: 380px; overflow-y: auto; padding: 6px; }
.x-pal-group { padding: 8px 14px 4px; font-size: 12px; color: var(--ink-3); font-weight: 600; }

.x-pal-item[aria-selected="true"] { background: var(--hover); }
.x-pal-label { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.x-pal-hint { font: 12px var(--mono); color: var(--ink-3); }
.x-pal-none { padding: 18px; color: var(--ink-3); }
.x-pal-foot { display: flex; gap: 16px; padding: 10px 18px; border-top: 1px solid var(--line-2); font-size: 12px; color: var(--ink-3); }
.x-dialog { width: min(440px, 100%); background: var(--tile); border-radius: 18px; box-shadow: var(--pop); padding: 22px 22px 18px; margin-top: 8vh; }

.x-toast { padding: 10px 16px; border-radius: 12px; background: var(--ink); color: var(--tile); font-size: 13.5px; font-weight: 500; box-shadow: var(--pop); transition: opacity .3s, transform .3s; }
.x-toast.out { opacity: 0; transform: translateY(6px); }

@media (prefers-reduced-motion: reduce) { *, *::after { animation: none !important; transition: none !important; } }
@media (max-width: 1100px) { .fleet { grid-template-columns: minmax(0, 1fr); } .nums { flex-wrap: wrap; gap: 14px 24px; } .ov, .x-report { grid-template-columns: minmax(0, 1fr); } .search { width: 40px; } .search span, .search kbd { display: none; } .lrow { grid-template-columns: 11px minmax(0, 1fr) auto 96px; } .lrow .rp, .lrow .m:nth-of-type(1) { display: none; } }
@media (max-width: 720px) {
  .gut { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

  .sheet { width: 100%; border-radius: 0; }

<body>
<header class="top gut">
  <div class="brand"><svg viewBox="0 0 20 20" aria-hidden="true"><rect x="0" y="0" width="9" height="9" rx="2.5" style="fill:var(--r0)"/><rect x="11" y="0" width="9" height="9" rx="2.5" style="fill:var(--r1)"/><rect x="0" y="11" width="9" height="9" rx="2.5" style="fill:var(--r3)"/><rect x="11" y="11" width="9" height="9" rx="2.5" style="fill:var(--ink)"/></svg>Pixel</div>
  <nav class="nav" id="nav" aria-label="Pages"></nav>
  <div class="right">
    <button class="search" id="search" aria-label="Search and commands"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><span>Jump to a run…</span><kbd>⌘K</kbd></button>
    <button class="btn primary" id="newrun"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>New run</button>
  </div>
</header>
<main class="gut" id="wall">
  <section class="fleet" id="fleet" aria-label="Fleet"></section>
  <div class="sec-t"><h2>Live</h2><span id="live-n"></span></div>
  <section class="tiles" id="tiles" aria-label="Live runs"></section>
  <div class="sec-t"><h2>Finished</h2><span id="fin-n"></span></div>
  <section class="list" id="finished" aria-label="Finished runs"></section>
</main>
<div class="scrim" id="scrim" hidden></div>
<aside class="sheet" id="sheet" aria-label="Run" aria-hidden="true"></aside>
<script>
(() => {
  const { runs, find, name, repoShort, fmt, r: R } = PX;
  const $ = (s, el = document) => el.querySelector(s);
  const IC = { pause: '<path d="M9 5v14M15 5v14"/>', play: '<path d="M7 5l12 7-12 7z"/>', stop: '<rect x="6" y="6" width="12" height="12" rx="1.5"/>', more: '<circle cx="5" cy="12" r="1.2" fill="currentColor"/><circle cx="12" cy="12" r="1.2" fill="currentColor"/><circle cx="19" cy="12" r="1.2" fill="currentColor"/>', x: '<path d="M6 6l12 12M18 6 6 18"/>', chev: '<path d="m6 9 6 6 6-6"/>', retry: '<path d="M20 12a8 8 0 1 1-2.3-5.6M20 4v5h-5"/>', send: '<path d="M12 19V5M5 12l7-7 7 7"/>' };
  const icon = (n) => `<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${IC[n]}</svg>`;
  const S = { open: null, tab: "overview", pmode: "text", file: null, seen: null, mode: "run" };
  const statusOf = (r) => (r.question ? "asking" : r.status);
  const WORD = { running: "Running", asking: "Waiting for you", recovering: "Recovering", preparing: "Preparing", paused: "Paused", stopped: "Stopped", failed: "Failed", done: "Report ready", triaged: "Triaged" };
  const onWall = (r) => PX.isLive(r) || PX.needsYou(r) || r.status === "paused";
  const rank = (r) => (r.question ? 0 : r.status === "failed" ? 1 : r.status === "running" ? 2 : 3);

  /* ---------- fleet ---------- */
  function renderFleet() {
    const f = PX.fleet();
    const live = runs.filter((r) => r.status === "running").length;
    const asking = runs.filter((r) => PX.needsYou(r)).length;
    $("#fleet").innerHTML = `<div class="counts"><span class="count"><span class="x-dot" data-s="running"></span><b>${live}</b>running</span>${asking ? `<button class="count warn" data-jump="needs"><span class="x-dot" data-s="asking"></span><b>${asking}</b>need${asking === 1 ? "s" : ""} you</button>` : ""}${f.triage ? `<button class="count" data-jump="triage"><span class="x-dot" data-s="done"></span><b>${f.triage}</b>to triage</button>` : ""}</div>
      <div class="nums"><div class="num"><b id="n-tps">${f.tps}</b><span>tokens / s now</span></div><div class="num"><b>${fmt.tok(f.tokensToday)}<small>${Math.round(f.cached * 100)}% cached</small></b><span>tokens today</span></div><div class="num"><b>${fmt.money(f.spend)}<small>→ ${fmt.money(f.projected)}</small></b><span>spent today, projected</span></div><div class="num"><b>${f.memUsed.toFixed(1)}<small>/ ${f.memTotal} GB</small></b><span>memory</span></div></div>
      <div class="flow"><div class="flow-chart" id="flow">${R.stacked(runs, 1200, 56)}</div><div class="flow-axis"><span>3 min ago</span><span>output tokens / s by run</span><span>now</span></div><div class="flow-legend" id="flow-legend">${legend()}</div></div>`;
  }
  const legend = () => runs.filter((r) => r.tpsHist.some((v) => v > 0)).map((r) => `<span><i style="background:var(--r${r.hue})"></i>${fmt.esc(name(r))}<em>${r.tps}</em></span>`).join("");

  /* ---------- tiles ---------- */
  const who = (r, aid) => { const a = r.agents.find((x) => x.id === aid); return aid === "main" ? "main" : a ? a.title.split(" ")[0].toLowerCase() : aid; };
  const logLine = (r, e, fresh) => `<li class="${fresh ? "in" : ""}"><span class="who">${fmt.esc(who(r, e.agent))}</span><span class="x-tool" data-kind="${e.kind}">${fmt.esc(e.tool)}</span><span class="cmd">${fmt.esc(e.text)}</span></li>`;
  function tileBody(r) {
    if (r.question)
      return `<form class="t-body ask" data-ask="${r.id}"><span class="lab">Asked ${fmt.ago(r.question.at)}</span><p>${fmt.esc(r.question.text)}</p><div class="x-ask-opts">${r.question.options.map((o) => `<button type="button" class="x-opt" data-opt="${fmt.esc(o)}">${fmt.esc(o)}</button>`).join("")}</div></form>`;
    if (r.status === "recovering") return `<div class="t-body note warn"><span>${fmt.esc(r.detail)}</span><span class="attempts"><i class="on"></i><i class="cur"></i><i></i><span>attempt 2 of 3</span></span></div>`;
    if (r.status === "preparing") return `<div class="t-body note warn"><span>${fmt.esc(r.detail)}…</span></div>`;
    if (r.status === "failed") return `<div class="t-body note bad"><span>${fmt.esc(r.detail)}</span><span><button class="btn sm" data-act="retry" data-id="${r.id}">${icon("retry")}Retry</button></span></div>`;
    if (r.status === "paused" || r.status === "stopped") return `<div class="t-body note"><span>${r.status === "paused" ? "Paused by you." : "Stopped. The machine is kept."}</span><span><button class="btn sm" data-act="resume" data-id="${r.id}">${icon("play")}Resume</button></span></div>`;
    return `<div class="t-body"><ol class="log" data-log="${r.id}">${r.log.slice(-6).map((e) => logLine(r, e)).join("")}</ol></div>`;
  }
  function tileProg(r) {
    const h = R.headline(r);
    if (!h) return `<div class="t-prog"><span class="tx" style="color:var(--ink-3)">No PROGRESS.md yet</span></div>`;
    const inline = (s) => fmt.esc(s).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    return `<div class="t-prog"><span class="lab ${h.label === "Found" ? "found" : ""}">${h.label}</span><span class="tx">${inline(h.text)}</span>${r.unseen ? `<span class="d" title="PROGRESS.md changed since you last looked">+${r.unseen.add}${r.unseen.del ? ` −${r.unseen.del}` : ""}</span>` : ""}</div>`;
  }
  function tile(r) {
    const s = statusOf(r);
    return `<article class="tile" data-tile="${r.id}" data-s="${s}">
      <header class="t-h"><span class="chip" style="background:var(--r${r.hue})"></span><button class="t-name" data-open="${r.id}">${fmt.esc(name(r))}</button>${r.unseen ? '<i class="unseen"></i>' : ""}<span class="t-st" data-s="${s}"><span class="x-dot" data-s="${s}"></span>${WORD[s]}</span></header>
      <div class="t-meta">${fmt.esc(repoShort(r))} · ${fmt.esc(fmt.shortModel(r.model))} · ${fmt.dur(Date.now() - r.started)}</div>
      ${tileBody(r)}
      ${tileProg(r)}
      ${r.status === "failed" ? "" : `<footer class="t-f"><span class="ag" title="${r.agents.length} agents">${r.agents.map((a) => `<i data-s="${a.status}"></i>`).join("")}</span><span class="bc" data-bc="${r.id}">${R.barcode(r, 160, 20)}</span><span><b data-tps="${r.id}">${r.tps || "–"}</b> tok/s</span><span><b data-cost="${r.id}">${fmt.money(r.cost)}</b></span></footer>`}
    </article>`;
  }
  function renderTiles() {
    const list = runs.filter(onWall).sort((a, b) => rank(a) - rank(b));
    $("#tiles").innerHTML = list.map(tile).join("") || `<div class="x-empty">Nothing running.</div>`;
    $("#live-n").textContent = `${list.length}`;
  }
  function renderFinished() {
    const list = runs.filter((r) => !onWall(r));
    $("#fin-n").textContent = `${list.length}`;
    $("#finished").innerHTML = list.map((r) => { const s = statusOf(r); return `<div class="lrow" data-row="${r.id}"><span class="chip" style="background:var(--r${r.hue})"></span><button class="n" data-open="${r.id}">${fmt.esc(name(r))}</button><span class="rp">${fmt.esc(repoShort(r))}</span><span class="s"><span class="x-dot" data-s="${s}"></span><span>${r.status === "triaged" ? `Triaged: ${fmt.esc(r.verdict)}` : `Report ready · ${fmt.ago(r.finished)}`}</span></span><span class="m">${fmt.dur((r.finished || Date.now()) - r.started)}</span><span class="m">${fmt.money(r.cost)}</span>${r.status === "done" ? `<button class="btn sm primary" data-triage-open="${r.id}">Triage</button>` : `<button class="btn sm" data-open="${r.id}">Open</button>`}</div>`; }).join("") || `<div class="lrow"><span></span><span class="x-empty">Nothing finished yet.</span></div>`;
  }
  function renderNav() {
    $("#nav").innerHTML = ["Runs", "Activity", "Models", "Stats", "Knowledge", "Templates", "Settings"].map((p) => `<button data-page="${p}" ${p === "Runs" ? 'aria-current="page"' : ""}>${p}</button>`).join("");
  }
  const renderWall = () => { renderFleet(); renderTiles(); renderFinished(); };

  /* ---------- sheet ---------- */
  function actions(r) {
    const b = [];
    if (r.status === "failed") b.push(`<button class="btn sm primary" data-act="retry">${icon("retry")}Retry</button>`);
    else if (r.status === "done") b.push(`<button class="btn sm primary" data-tab="report">Triage</button>`);
    else if (r.status === "paused" || r.status === "stopped") b.push(`<button class="btn sm primary" data-act="resume">${icon("play")}Resume</button>`);
    else if (["running", "recovering"].includes(r.status)) b.push(`<button class="btn sm" data-act="pause">${icon("pause")}Pause</button><button class="btn sm danger" data-act="stop">${icon("stop")}Stop</button>`);
    b.push(`<button class="btn sm icon" id="more" aria-label="More actions" aria-haspopup="menu">${icon("more")}</button><button class="btn sm icon" data-close aria-label="Close (Esc)">${icon("x")}</button>`);
    return b.join("");
  }
  const TABS = [["overview", "Overview"], ["transcript", "Transcript"], ["files", "Files"], ["timeline", "Timeline"], ["report", "Report"], ["terminal", "Terminal"], ["machine", "Machine"]];
  function overview(r) {
    const u = S.seen && S.seen.id === r.id ? S.seen.d : null;
    return `<div class="ov"><div class="ov-main">${R.question(r)}<section><div class="sec-h"><h2>Progress</h2>${r.progressAt ? `<span class="meta">updated ${fmt.ago(r.progressAt)}</span>` : ""}${u ? `<span class="delta">+${u.add}${u.del ? ` −${u.del}` : ""} since you looked</span>` : ""}<div class="right"><div class="seg" role="group" aria-label="Progress view"><button data-pmode="text" aria-pressed="${S.pmode === "text"}">Text</button><button data-pmode="changes" aria-pressed="${S.pmode === "changes"}">Changes</button></div></div></div>${R.progress(r, S.pmode)}</section></div>
      <aside class="ov-side"><section class="side-card"><div class="sec-h"><h2>Agents</h2><span class="meta">${PX.working(r)} of ${r.agents.length} working</span></div>${R.agents(r)}</section>
        <section><div class="sec-h"><h2>Last 60 minutes</h2></div><div id="lanes">${R.lanes(r)}</div>${R.legend()}</section>
        <section><div class="sec-h"><h2>Todos</h2><span class="meta">${r.todos.filter((t) => t[0] === "completed").length} of ${r.todos.length}</span></div>${R.todos(r)}</section>
        <section><div class="sec-h"><h2>Other workbases</h2></div>${R.crossReads(r)}</section></aside></div>`;
  }
  function body(r) {
    switch (S.tab) {
      case "transcript": return `<div class="pad">${R.transcript(r)}</div>`;
      case "files": return `<div class="pad">${R.files(r, S.file)}</div>`;
      case "timeline": return `<div class="pad">${R.timeline(r)}</div>`;
      case "report": return `<div class="pad">${R.report(r)}</div>`;
      case "terminal": return `<div class="pad">${R.terminal(r)}</div>`;
      case "machine": return `<div class="pad">${R.machine(r)}</div>`;
      default: return overview(r);
    }
  }
  function renderSheet() {
    const el = $("#sheet");
    if (S.mode === "new") {
      el.innerHTML = `<div class="sh"><div class="sh-top"><h1>New run</h1><div class="acts"><button class="btn sm icon" data-close aria-label="Close">${icon("x")}</button></div></div></div><div class="sb"><div class="pad" style="padding-left:28px">${PX.newRunForm(S.newPre || {})}</div></div>`;
      PX.bindNewRun($("#x-newrun"), (id) => openRun(id), closeSheet);
      return;
    }
    if (S.mode === "activity") {
      el.innerHTML = `<div class="sh"><div class="sh-top"><h1>Activity</h1><div class="acts"><button class="btn sm icon" data-close aria-label="Close">${icon("x")}</button></div></div></div><div class="sb"><div class="pad" style="padding-left:28px"><ol class="x-tl" id="feed">${feedRows()}</ol></div></div>`;
      return;
    }
    const r = find(S.open);
    if (!r) return closeSheet();
    const s = statusOf(r);
    const notice = r.status === "failed" ? `<div class="notice bad">${fmt.esc(r.detail)}</div>` : r.status === "recovering" || r.status === "preparing" ? `<div class="notice">${fmt.esc(r.detail)}</div>` : "";
    const live = ["running", "recovering", "paused", "stopped"].includes(r.status);
    el.innerHTML = `<div class="sh"><div class="sh-top"><span class="chip" style="background:var(--r${r.hue})"></span><h1 id="sname" title="Double-click to rename">${fmt.esc(name(r))}</h1><span class="pill" data-s="${s}"><span class="x-dot" data-s="${s}"></span>${WORD[s]}</span><div class="acts">${actions(r)}</div></div>
      <div class="sh-meta"><a href="https://${fmt.esc(r.repo)}" target="_blank" rel="noreferrer">${fmt.esc(repoShort(r))}</a><span>${fmt.esc(r.ref)}${r.commit ? ` @ ${r.commit.slice(0, 7)}` : ""}</span><span>${fmt.esc(r.template)}</span><span>started ${fmt.ago(r.started)}</span>${r.label ? `<span>${r.id}</span>` : ""}</div>${notice}
      <dl class="facts"><div><dt>Model</dt><dd><button class="fact-btn" id="f-model" aria-haspopup="menu">${fmt.esc(fmt.shortModel(r.model))} <small>${r.variant}</small>${icon("chev")}</button></dd></div><div><dt>Key</dt><dd><button class="fact-btn" id="f-key" aria-haspopup="menu">${fmt.esc(r.key)}${icon("chev")}</button><small>${r.failover ? "failover" : ""}</small></dd></div><div><dt>Tokens</dt><dd id="f-tok">${fmt.tok(r.tokens.in + r.tokens.out)}</dd></div><div><dt>Cost</dt><dd id="f-cost">${fmt.money(r.cost)}</dd></div><div><dt>Context</dt><dd>${fmt.tok(r.ctx)} <small>of ${fmt.tok(r.ctxMax)}</small></dd></div><div><dt>Machine</dt><dd>${r.machine.cpu} CPU · ${r.machine.mem} GiB <small id="f-cpu">${r.machine.cpuPct}%</small></dd></div></dl></div>
      <nav class="tabs" role="tablist">${TABS.map(([id, l]) => `<button role="tab" data-tab="${id}" aria-selected="${S.tab === id}">${l}${id === "overview" && r.question ? '<span class="badge">●</span>' : ""}${id === "report" && r.report ? `<span class="badge" style="color:var(--info)">${r.status === "triaged" ? "✓" : "●"}</span>` : ""}</button>`).join("")}</nav>
      <div class="sb" id="sb">${body(r)}</div>
      <form class="compose" id="compose"><div class="cbox"><textarea id="msg" rows="1" ${live ? "" : "disabled"} placeholder="${live ? `Message ${fmt.esc(name(r))}` : "This run has no live session"}" aria-label="Message the agent"></textarea><button type="button" class="btn sm" data-act="continue" ${live ? "" : "disabled"}>Send continue</button><button type="submit" class="btn sm primary icon" aria-label="Send" ${live ? "" : "disabled"}>${icon("send")}</button></div></form>`;
  }
  function feedRows() {
    return PX.feed.slice().reverse().slice(0, 60).map((e) => { const r = find(e.run); return `<li><span class="x-tl-time">${fmt.clock(e.ts)}</span><span class="x-tl-actor"><span class="chip" style="display:inline-block;background:var(--r${r ? r.hue : 0})"></span></span><span><b>${fmt.esc(r ? name(r) : e.run)}</b> <span class="x-tool" data-kind="${e.kind}">${fmt.esc(e.tool)}</span> <span class="mono" style="font-size:12.5px;color:var(--ink-2)">${fmt.esc(e.text)}</span></span></li>`; }).join("");
  }
  let lastFocus = null;
  function showSheet() {
    const sc = $("#scrim"), sh = $("#sheet");
    if (!sh.classList.contains("on")) lastFocus = document.activeElement;
    sc.hidden = false;
    requestAnimationFrame(() => { sc.classList.add("on"); sh.classList.add("on"); });
    sh.setAttribute("aria-hidden", "false");
    document.body.classList.add("locked");
    setTimeout(() => (sh.querySelector("#nr-repo") || sh.querySelector("[data-close]"))?.focus(), 60);
  }
  function closeSheet() {
    const sc = $("#scrim"), sh = $("#sheet");
    sc.classList.remove("on"); sh.classList.remove("on");
    sh.setAttribute("aria-hidden", "true");
    document.body.classList.remove("locked");
    setTimeout(() => (sc.hidden = true), 250);
    S.open = null; S.mode = "run";
    lastFocus?.focus?.();
  }
  function openRun(id, tab) {
    const r = find(id);
    if (!r) return;
    S.mode = "run"; S.open = id; S.file = null;
    S.tab = tab || (r.status === "done" ? "report" : "overview");
    if (r.unseen) { S.seen = { id, d: r.unseen }; setTimeout(() => PX.act(id, "seen"), 1200); }
    renderSheet(); showSheet();
  }
  function rename(id) {
    const h = $("#sname");
    if (!h) return;
    h.innerHTML = `<input id="rn-in" value="${fmt.esc(name(find(id)))}" aria-label="Run name" style="font:inherit;letter-spacing:inherit;border:1px solid var(--accent);border-radius:8px;padding:0 6px;background:var(--tile);width:min(420px,60vw)">`;
    const i = $("#rn-in");
    i.focus(); i.select();
    const done = (save) => (save ? PX.act(id, "rename", i.value.trim()) : renderSheet());
    i.addEventListener("keydown", (e) => { if (e.key === "Enter") done(true); if (e.key === "Escape") (e.stopPropagation(), done(false)); });
    i.addEventListener("blur", () => done(true), { once: true });
  }
  PX.ui = {
    current: () => S.open,
    openRun: (id) => openRun(id),
    openPage: (p) => { if (p === "Activity") { S.mode = "activity"; S.open = null; renderSheet(); showSheet(); } else PX.toast(`${p} is not part of this mockup`); },
    newRun: (pre) => { S.mode = "new"; S.newPre = pre; S.open = null; renderSheet(); showSheet(); },
    rename,
    openFile: (f) => { S.file = f; $("#sb").innerHTML = body(find(S.open)); },
    modelMenu: (id) => PX.modelMenu($("#f-model"), id),
  };

  document.addEventListener("click", (e) => {
    const t = e.target;
    if (t.closest(".x-menu, .x-pal, .x-dialog-scrim")) return;
    if (t.closest("#scrim") || t.closest("[data-close]")) return closeSheet();
    const a = t.closest("[data-act]");
    if (a) return PX.act(a.dataset.id || S.open, a.dataset.act);
    if (t.closest(".x-opt, form[data-ask] input")) return;
    const tri = t.closest("[data-triage-open]"); if (tri) return openRun(tri.dataset.triageOpen, "report");
    const op = t.closest("[data-open]"); if (op) return openRun(op.dataset.open);
    const tl = t.closest("[data-tile]"); if (tl) return openRun(tl.dataset.tile);
    const row = t.closest("[data-row]"); if (row) return openRun(row.dataset.row);
    const j = t.closest("[data-jump]"); if (j) { const r = runs.find((x) => (j.dataset.jump === "needs" ? PX.needsYou(x) : x.status === "done")); if (r) openRun(r.id, j.dataset.jump === "triage" ? "report" : undefined); return; }
    const tab = t.closest("[data-tab]"); if (tab) { S.tab = tab.dataset.tab; return renderSheet(); }
    const pm = t.closest("[data-pmode]"); if (pm) { S.pmode = pm.dataset.pmode; return renderSheet(); }
    const p = t.closest("[data-page]"); if (p) return PX.ui.openPage(p.dataset.page);
    if (t.closest("#more")) return PX.runMenu(t.closest("#more"), S.open);
    if (t.closest("#f-model")) return PX.modelMenu(t.closest("#f-model"), S.open);
    if (t.closest("#f-key")) return PX.keyMenu(t.closest("#f-key"), S.open);
    if (t.closest("#search")) return PX.palette();
    if (t.closest("#newrun")) return PX.ui.newRun({});
  });
  document.addEventListener("dblclick", (e) => { if (e.target.closest("#sname")) rename(S.open); });
  document.addEventListener("input", (e) => { if (e.target.id === "msg") { e.target.style.height = "auto"; e.target.style.height = Math.min(160, e.target.scrollHeight) + "px"; } });
  document.addEventListener("keydown", (e) => {
    if (e.target.id === "msg" && e.key === "Enter" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); $("#compose").requestSubmit(); return; }
    if (e.key === "Escape" && $("#sheet").classList.contains("on") && !document.querySelector(".x-menu, .x-pal, .x-dialog-scrim")) { closeSheet(); return; }
    if (e.metaKey || e.ctrlKey || e.altKey || e.target.closest("input, textarea, select, .x-pal, .x-dialog-scrim, .x-menu")) return;
    if (e.key === "n" && !$("#sheet").classList.contains("on")) { e.preventDefault(); PX.ui.newRun({}); }
  });
  document.addEventListener("submit", (e) => {
    if (e.target.id !== "compose") return;
    e.preventDefault();
    const m = $("#msg");
    if (m.value.trim()) { PX.message(S.open, m.value.trim()); m.value = ""; m.style.height = "auto"; }
  });

  /* ---------- live ---------- */
  let lanesAt = 0;
  PX.on("tick", (ev) => {
    const r = find(ev.run);
    const log = document.querySelector(`[data-log="${ev.run}"]`);
    if (log) { log.insertAdjacentHTML("beforeend", logLine(r, ev, true)); while (log.children.length > 6) log.firstElementChild.remove(); }
    const bc = document.querySelector(`[data-bc="${ev.run}"]`); if (bc) bc.innerHTML = R.barcode(r, 160, 20);
    const c = document.querySelector(`[data-cost="${ev.run}"]`); if (c) c.textContent = fmt.money(r.cost);
    if (S.mode === "run" && S.open === ev.run) {
      const a = r.agents.find((x) => x.id === ev.agent);
      const el = document.querySelector(`[data-now="${ev.run}:${ev.agent}"]`);
      if (el && a) el.innerHTML = R.agentNow(r, a);
      $("#f-tok") && ($("#f-tok").textContent = fmt.tok(r.tokens.in + r.tokens.out));
      $("#f-cost") && ($("#f-cost").textContent = fmt.money(r.cost));
      if (Date.now() - lanesAt > 4000 && $("#lanes")) { lanesAt = Date.now(); $("#lanes").innerHTML = R.lanes(r); }
    }
    if (S.mode === "activity" && $("#feed")) $("#feed").innerHTML = feedRows();
  });
  PX.on("rates", () => {
    const f = PX.fleet();
    $("#n-tps") && ($("#n-tps").textContent = f.tps);
    $("#flow") && ($("#flow").innerHTML = R.stacked(runs, 1200, 56));
    $("#flow-legend") && ($("#flow-legend").innerHTML = legend());
    for (const r of runs) { const el = document.querySelector(`[data-tps="${r.id}"]`); if (el) el.textContent = r.tps || "–"; }
    const r = find(S.open); $("#f-cpu") && r && ($("#f-cpu").textContent = `${r.machine.cpuPct}%`);
  });
  PX.on("minute", () => renderTiles());
  PX.on("change", (d) => {
    renderWall();
    if (d && d.action === "seen") return;
    if (d && d.action === "created") return;
    if (d && d.quiet && d.action === "message") { if (S.open && ["transcript", "timeline"].includes(S.tab)) $("#sb").innerHTML = body(find(S.open)); return; }
    if ($("#sheet").classList.contains("on") && S.mode === "run") {
      if (!find(S.open)) return closeSheet();
      const keep = $("#sb")?.scrollTop || 0;
      renderSheet();
      if ($("#sb")) $("#sb").scrollTop = keep;
    }
  });

  renderNav();
  renderWall();
  PX.switcher("c");
  PX.start();
})();
</script>
</body>
</html>
