<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Pixel · A Workbench</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<script src="shared.js"></script>
<style>
/* Layout: runs are the sidebar; the selected run fills the page (header, facts, tabs, body, docked composer). */
:root {
  --bg: #f2f3f5; --panel: #ffffff; --sunk: #f7f8fa; --hover: #e8eaee; --line: #e1e4e9; --line-2: #eceef2;
  --ink: #13161b; --ink-2: #4b5260; --ink-3: #7c8390;
  --accent: #0d7a70; --accent-2: #0a655d; --accent-bg: #e2f2ef; --on-accent: #ffffff;
  --ok: #188a4c; --ok-bg: #e4f4ea; --warn: #a96300; --warn-bg: #fcf2df; --bad: #c43636; --bad-bg: #fbeaea; --info: #2b5fca; --info-bg: #e7eefb;
  --k-shell: #0e9384; --k-read: #a3a9b4; --k-edit: #2f6fe0; --k-task: #7a57e0; --k-web: #d0621b; --k-bad: #c43636;
  --r0: #0e9384; --r1: #2f6fe0; --r2: #7a57e0; --r3: #d23f8c; --r4: #5d9a1c; --r5: #d0621b;
  --shadow: 0 1px 2px rgba(17, 24, 39, .06), 0 0 0 1px rgba(17, 24, 39, .04);
  --pop: 0 16px 40px rgba(17, 24, 39, .16), 0 0 0 1px rgba(17, 24, 39, .06);
  --sans: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1013; --panel: #14171b; --sunk: #191c21; --hover: #1d2026; --line: #262a31; --line-2: #1e2127;
    --ink: #e7e9ec; --ink-2: #a6acb6; --ink-3: #6f7682;
    --accent: #3cc6b4; --accent-2: #62d6c6; --accent-bg: rgba(60, 198, 180, .13); --on-accent: #06201c;
    --ok: #4cc287; --ok-bg: rgba(76, 194, 135, .13); --warn: #e3a447; --warn-bg: rgba(227, 164, 71, .13); --bad: #ef6b6b; --bad-bg: rgba(239, 107, 107, .13); --info: #7aa3ff; --info-bg: rgba(122, 163, 255, .13);
    --k-shell: #36c2b0; --k-read: #59606b; --k-edit: #6ea2ff; --k-task: #a58bfa; --k-web: #f0a35e; --k-bad: #ef6b6b;
    --r0: #36c2b0; --r1: #6ea2ff; --r2: #a58bfa; --r3: #f07fb6; --r4: #a5d65a; --r5: #f0a35e;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 0 0 1px rgba(255, 255, 255, .05);
    --pop: 0 16px 40px rgba(0, 0, 0, .5), 0 0 0 1px rgba(255, 255, 255, .08);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1013; --panel: #14171b; --sunk: #191c21; --hover: #1d2026; --line: #262a31; --line-2: #1e2127;
  --ink: #e7e9ec; --ink-2: #a6acb6; --ink-3: #6f7682;
  --accent: #3cc6b4; --accent-2: #62d6c6; --accent-bg: rgba(60, 198, 180, .13); --on-accent: #06201c;
  --ok: #4cc287; --ok-bg: rgba(76, 194, 135, .13); --warn: #e3a447; --warn-bg: rgba(227, 164, 71, .13); --bad: #ef6b6b; --bad-bg: rgba(239, 107, 107, .13); --info: #7aa3ff; --info-bg: rgba(122, 163, 255, .13);
  --k-shell: #36c2b0; --k-read: #59606b; --k-edit: #6ea2ff; --k-task: #a58bfa; --k-web: #f0a35e; --k-bad: #ef6b6b;
  --r0: #36c2b0; --r1: #6ea2ff; --r2: #a58bfa; --r3: #f07fb6; --r4: #a5d65a; --r5: #f0a35e;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 0 0 1px rgba(255, 255, 255, .05);
  --pop: 0 16px 40px rgba(0, 0, 0, .5), 0 0 0 1px rgba(255, 255, 255, .08);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font: 14px/1.5 var(--sans); -webkit-font-smoothing: antialiased; overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; border-radius: 6px; }
code, kbd, .mono { font-family: var(--mono); }
kbd { font-size: 11px; color: var(--ink-3); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; background: var(--panel); }
svg.i { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; flex: none; }

.app { display: grid; grid-template-columns: 284px minmax(0, 1fr); height: 100%; }

/* ---------- sidebar ---------- */
.side { display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--line); padding: 14px 10px 10px; gap: 12px; }
.brand { display: flex; align-items: center; gap: 9px; padding: 0 6px; height: 30px; }
.brand b { font-weight: 600; font-size: 15px; letter-spacing: -.01em; }
.brand .host { font: 12px var(--mono); color: var(--ink-3); }
.brand .icon-btn { margin-left: auto; }
.mark { width: 18px; height: 18px; color: var(--ink); }
.icon-btn { display: inline-grid; place-items: center; width: 30px; height: 30px; border-radius: 7px; border: 0; background: none; color: var(--ink-2); }
.icon-btn:hover { background: var(--hover); color: var(--ink); }
.new-btn { display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); box-shadow: var(--shadow); font-weight: 500; }
.new-btn:hover { border-color: var(--ink-3); }
.new-btn kbd { margin-left: auto; }

.fleet { display: grid; grid-template-columns: 58px 1fr; row-gap: 5px; column-gap: 8px; padding: 2px 8px 4px; font-size: 12px; align-items: center; }
.fleet dt { color: var(--ink-3); }
.fleet dd { margin: 0; display: flex; align-items: center; gap: 8px; font-family: var(--mono); font-variant-numeric: tabular-nums; color: var(--ink-2); min-width: 0; white-space: nowrap; }
.fleet dd b { color: var(--ink); font-weight: 500; }
.fleet .x-spark { margin-left: auto; }
.membar { display: flex; height: 6px; flex: 1; border-radius: 3px; overflow: hidden; background: var(--line); gap: 1px; }
.membar i { display: block; height: 100%; }

.runs { flex: 1; min-height: 0; overflow-y: auto; margin: 0 -4px; padding: 0 4px; display: flex; flex-direction: column; gap: 14px; }
.grp-h { display: flex; justify-content: space-between; padding: 0 8px 4px; font-size: 12px; color: var(--ink-3); font-weight: 500; }
.grp ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 1px; }
.ri { display: grid; grid-template-columns: 12px minmax(0, 1fr) auto; column-gap: 8px; row-gap: 1px; align-items: center; width: 100%; padding: 7px 8px 8px; border-radius: 8px; border: 1px solid transparent; background: none; text-align: left; }
.ri:hover { background: var(--hover); }
.ri[aria-current="true"] { background: var(--panel); border-color: var(--line); box-shadow: var(--shadow); }
.ri .nm { display: flex; align-items: center; gap: 6px; font-weight: 500; min-width: 0; }
.ri .nm span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ri .tm { font: 12px var(--mono); color: var(--ink-3); font-variant-numeric: tabular-nums; }
.ri .ln { grid-column: 2 / 4; font: 12px/1.45 var(--mono); color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ri .ln.warn { color: var(--warn); font-family: var(--sans); }
.ri .ln.bad { color: var(--bad); font-family: var(--sans); }
.ri .ln.plain { font-family: var(--sans); }
.ri .ln .t { margin-right: 6px; }
.unseen { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); flex: none; }

.pages { display: grid; grid-template-columns: 1fr 1fr; gap: 1px 4px; padding-top: 10px; border-top: 1px solid var(--line); }
.pages button { display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 8px; border: 0; border-radius: 7px; background: none; color: var(--ink-2); font-size: 13px; text-align: left; }
.pages button:hover { background: var(--hover); color: var(--ink); }
.pages button[aria-current="page"] { color: var(--ink); background: var(--hover); }
.conn { display: flex; align-items: center; gap: 7px; padding: 4px 8px 0; font: 12px var(--mono); color: var(--ink-3); }
.conn i { width: 6px; height: 6px; border-radius: 50%; background: var(--ok); }

/* status dot used everywhere */
.x-dot { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--ink-3); position: relative; }
.x-dot[data-s="running"] { background: var(--ok); }
.x-dot[data-s="running"].busy::after { content: ""; position: absolute; inset: -3px; border-radius: 50%; border: 1.5px solid var(--ok); opacity: .35; animation: pulse 2s ease-out infinite; }
.x-dot[data-s="asking"], .x-dot[data-s="recovering"], .x-dot[data-s="preparing"] { background: var(--warn); }
.x-dot[data-s="failed"] { background: var(--bad); }
.x-dot[data-s="stopped"], .x-dot[data-s="paused"] { background: transparent; box-shadow: inset 0 0 0 1.5px var(--ink-3); }
.x-dot[data-s="done"] { background: var(--info); }
.x-dot[data-s="triaged"] { background: transparent; box-shadow: inset 0 0 0 1.5px var(--info); }
@keyframes pulse { from { transform: scale(.7); opacity: .5; } to { transform: scale(1.5); opacity: 0; } }

/* ---------- main ---------- */
.main { background: var(--panel); display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.rh { padding: 18px 32px 0; display: flex; flex-direction: column; gap: 6px; }
.rh-top { display: flex; align-items: flex-start; gap: 16px; }
.rh-title { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 12px; min-width: 0; flex: 1; }
.rh h1 { margin: 0; font-size: 22px; line-height: 1.25; font-weight: 600; letter-spacing: -.015em; text-wrap: balance; cursor: text; }
.rh h1 input { font: inherit; letter-spacing: inherit; border: 1px solid var(--accent); border-radius: 6px; padding: 0 6px; margin: -1px -7px; background: var(--panel); width: min(520px, 100%); }
.pill { display: inline-flex; align-items: center; gap: 7px; height: 24px; padding: 0 10px; border-radius: 999px; font-size: 12.5px; font-weight: 500; background: var(--sunk); color: var(--ink-2); }
.pill[data-s="running"] { background: var(--ok-bg); color: var(--ok); }
.pill[data-s="asking"], .pill[data-s="recovering"], .pill[data-s="preparing"] { background: var(--warn-bg); color: var(--warn); }
.pill[data-s="failed"] { background: var(--bad-bg); color: var(--bad); }
.pill[data-s="done"], .pill[data-s="triaged"] { background: var(--info-bg); color: var(--info); }
.pill .x-dot { width: 6px; height: 6px; }
.rh-sub { color: var(--ink-3); font-size: 13px; }
.rh-actions { display: flex; gap: 6px; flex: none; }
.btn { display: inline-flex; align-items: center; gap: 7px; height: 32px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); font-weight: 500; font-size: 13px; box-shadow: var(--shadow); white-space: nowrap; }
.btn:hover { border-color: var(--ink-3); }
.btn.icon { width: 32px; padding: 0; justify-content: center; }
.btn.primary, .x-primary { background: var(--ink); color: var(--panel); border-color: var(--ink); }
.btn.primary:hover, .x-primary:hover { opacity: .9; }
.btn.danger-t { color: var(--bad); }
.btn:disabled { opacity: .45; cursor: default; }
.rh-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; color: var(--ink-2); font-size: 13px; }
.rh-meta a { color: var(--ink-2); text-decoration: none; display: inline-flex; align-items: center; gap: 4px; }
.rh-meta a:hover { color: var(--accent); }
.rh-meta .mono { font-size: 12.5px; }
.rh-meta .sep { color: var(--line); }
.notice { display: flex; align-items: center; gap: 12px; margin-top: 6px; padding: 9px 12px; border-radius: 8px; font-size: 13px; background: var(--warn-bg); color: var(--ink); }
.notice.bad { background: var(--bad-bg); }
.notice .btn { margin-left: auto; height: 28px; }

.facts { display: flex; flex-wrap: wrap; gap: 6px 0; margin: 10px 0 0; padding: 0; }
.facts > div { padding: 0 18px 0 0; margin-right: 18px; border-right: 1px solid var(--line-2); min-width: 0; }
.facts > div:last-child { border-right: 0; }
.facts dt { font-size: 12px; color: var(--ink-3); }
.facts dd { margin: 1px 0 0; font: 13px var(--mono); font-variant-numeric: tabular-nums; display: flex; align-items: center; gap: 6px; white-space: nowrap; }
.facts dd small { font: 12px var(--sans); color: var(--ink-3); }
.fact-btn { display: inline-flex; align-items: center; gap: 4px; border: 0; background: none; padding: 0; font: inherit; color: inherit; border-bottom: 1px dashed var(--ink-3); }
.fact-btn:hover { color: var(--accent); border-color: var(--accent); }
.fact-btn svg.i { width: 12px; height: 12px; }
.gauge { width: 44px; height: 5px; border-radius: 3px; background: var(--line); overflow: hidden; }
.gauge i { display: block; height: 100%; background: var(--ink-3); }

.tabs { display: flex; gap: 22px; padding: 0 32px; margin-top: 14px; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
.tabs button { position: relative; border: 0; background: none; padding: 10px 0 11px; color: var(--ink-3); font-weight: 500; font-size: 13.5px; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
.tabs button:hover { color: var(--ink); }
.tabs button[aria-selected="true"] { color: var(--ink); }
.tabs button[aria-selected="true"]::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: var(--ink); border-radius: 2px; }
.tabs .badge { font-size: 11px; color: var(--accent); }
.tabs .badge.warn { color: var(--warn); }

.body { flex: 1; min-height: 0; overflow-y: auto; }
.pad { padding: 24px 32px 40px; }

/* overview */
.ov { display: grid; grid-template-columns: minmax(0, 1fr) minmax(300px, 380px); min-height: 100%; }
.ov-main { padding: 24px 40px 48px 32px; display: flex; flex-direction: column; gap: 24px; min-width: 0; }
.ov-side { padding: 24px 28px 48px; border-left: 1px solid var(--line-2); display: flex; flex-direction: column; gap: 28px; background: var(--sunk); min-width: 0; }
.sec-h { display: flex; align-items: center; gap: 10px; margin: 0 0 10px; }
.sec-h h2 { margin: 0; font-size: 14px; font-weight: 600; }
.sec-h .meta { font-size: 12.5px; color: var(--ink-3); }
.sec-h .right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.delta { font: 12px var(--mono); }
.delta .a { color: var(--ok); } .delta .d { color: var(--bad); }
.seg { display: inline-flex; padding: 2px; border-radius: 8px; background: var(--sunk); border: 1px solid var(--line-2); }
.seg button { border: 0; background: none; height: 24px; padding: 0 9px; border-radius: 6px; font-size: 12.5px; color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--panel); color: var(--ink); box-shadow: var(--shadow); }
.vsel { height: 28px; border: 1px solid var(--line); border-radius: 7px; background: var(--panel); font-size: 12.5px; padding: 0 6px; color: var(--ink-2); }

.x-md { max-width: 70ch; font-size: 15px; line-height: 1.6; }
.x-md h2 { font-size: 20px; margin: 0 0 8px; }
.x-md h3 { font-size: 12.5px; font-weight: 600; color: var(--ink-3); margin: 22px 0 6px; letter-spacing: .01em; }
.x-md h3:first-child { margin-top: 0; }
.x-md ul { margin: 0; padding: 0 0 0 18px; }
.x-md li { margin: 3px 0; padding-left: 2px; position: relative; }
.x-md li::marker { color: var(--ink-3); }
.x-md p { margin: 0 0 8px; }
.x-md code { font-size: .86em; background: var(--sunk); border: 1px solid var(--line-2); padding: 1px 5px; border-radius: 5px; }
.x-md strong { font-weight: 600; }
.x-md li.new { background: var(--accent-bg); border-radius: 4px; box-shadow: -8px 0 0 var(--accent-bg), 6px 0 0 var(--accent-bg); }
.x-md.changes li, .x-md.changes h3 { opacity: .5; }
.x-md.changes .add, .x-md.changes .del { opacity: 1; }
.x-md.changes li.add { background: var(--ok-bg); border-radius: 4px; box-shadow: -8px 0 0 var(--ok-bg); }
.x-md.changes li.del { background: var(--bad-bg); border-radius: 4px; box-shadow: -8px 0 0 var(--bad-bg); text-decoration: line-through; text-decoration-color: color-mix(in srgb, var(--bad) 60%, transparent); }

.x-ask { border: 1px solid color-mix(in srgb, var(--warn) 45%, var(--line)); background: var(--warn-bg); border-radius: 12px; padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; }
.x-ask-head { display: flex; gap: 10px; font-size: 12.5px; }
.x-ask-label { color: var(--warn); font-weight: 600; }
.x-ask-ago { color: var(--ink-3); }
.x-ask-q { margin: 0; font-size: 15px; line-height: 1.55; max-width: 70ch; }
.x-ask-opts { display: flex; flex-wrap: wrap; gap: 6px; }
.x-opt { display: inline-flex; align-items: center; gap: 8px; height: 32px; padding: 0 12px 0 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); font-weight: 500; font-size: 13px; box-shadow: var(--shadow); }
.x-opt:hover { border-color: var(--warn); }
.x-opt kbd { font-size: 10.5px; }
.x-ask-custom { display: flex; gap: 6px; }
.x-ask-custom input { flex: 1; min-width: 0; height: 32px; border: 1px solid var(--line); border-radius: 8px; padding: 0 10px; background: var(--panel); }
.x-ask-send { height: 32px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--ink); background: var(--ink); color: var(--panel); font-weight: 500; font-size: 13px; }

.x-agents, .x-kids { list-style: none; margin: 0; padding: 0; }
.x-kids { margin: 2px 0 0 4px; padding-left: 14px; border-left: 1px solid var(--line); }
.x-agent { padding: 5px 0; }
.x-agent-top { display: flex; align-items: center; gap: 8px; }
.x-agent-t { font-weight: 500; font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.x-agent[data-s="done"] > .x-agent-top .x-agent-t { color: var(--ink-3); font-weight: 400; }
.x-agent-age { margin-left: auto; font: 12px var(--mono); color: var(--ink-3); }
.x-agent-now { display: flex; gap: 6px; margin: 2px 0 0 18px; font: 12px/1.5 var(--mono); min-width: 0; color: var(--ink-2); }
.x-agent-now .x-cmd { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.x-agent-now .x-state { font-family: var(--sans); color: var(--ink-3); }
.x-agent-now .x-state.warn { color: var(--warn); }
.x-agent-now.flash .x-cmd { animation: flash .9s ease-out; }
@keyframes flash { from { color: var(--accent); } to { color: var(--ink-2); } }
.x-ring { width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--ink-3); flex: none; }
.x-ring[data-s="running"] { border-color: var(--ok); border-right-color: transparent; animation: spin 1.1s linear infinite; }
.x-ring[data-s="waiting"] { border-color: var(--ok); border-style: dotted; }
.x-ring[data-s="done"] { border-color: var(--ink-3); background: var(--ink-3); opacity: .5; }
.x-ring[data-s="interrupted"], .x-ring[data-s="idle"] { border-color: var(--warn); }
.x-ring[data-s="starting"] { border-color: var(--warn); border-right-color: transparent; animation: spin 1.1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.x-tool { font-weight: 500; flex: none; }
.x-tool[data-kind="shell"] { color: var(--k-shell); } .x-tool[data-kind="read"] { color: var(--ink-3); } .x-tool[data-kind="edit"] { color: var(--k-edit); } .x-tool[data-kind="task"] { color: var(--k-task); } .x-tool[data-kind="web"] { color: var(--k-web); }

.x-lanes { display: flex; flex-direction: column; gap: 6px; }
.x-lane { display: grid; grid-template-columns: 104px minmax(0, 1fr); gap: 10px; align-items: center; }
.x-lane-n { font-size: 12px; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.x-lane svg { width: 100%; height: 12px; display: block; }
.x-lane svg line { stroke-width: 2px; vector-effect: non-scaling-stroke; }
.x-lane-axis > div { display: flex; justify-content: space-between; font: 11px var(--mono); color: var(--ink-3); }
.x-legend { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 10px; font-size: 12px; color: var(--ink-3); }
.x-legend i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 5px; }

.x-todos { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 5px; font-size: 13.5px; }
.x-todos li { display: flex; gap: 9px; align-items: baseline; }
.x-check { width: 12px; height: 12px; border-radius: 3px; border: 1.5px solid var(--ink-3); flex: none; position: relative; top: 1px; }
.x-todos li[data-s="completed"] { color: var(--ink-3); text-decoration: line-through; text-decoration-color: var(--line); }
.x-todos li[data-s="completed"] .x-check { background: var(--ink-3); border-color: var(--ink-3); }
.x-todos li[data-s="in_progress"] .x-check { border-color: var(--accent); background: linear-gradient(90deg, var(--accent) 50%, transparent 50%); }
.x-reads { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; font-size: 13px; }
.x-reads li { display: flex; gap: 8px; align-items: baseline; }
.x-reads-dir { color: var(--ink-3); width: 56px; flex: none; }
.x-reads-n { color: var(--ink-3); font-family: var(--mono); font-size: 12px; }
.x-link { border: 0; background: none; padding: 0; color: var(--accent); font: inherit; text-align: left; }
.x-link:hover { text-decoration: underline; }
.x-empty { color: var(--ink-3); font-size: 13px; }
.res { display: grid; grid-template-columns: auto 1fr auto; gap: 7px 10px; align-items: center; font-size: 12.5px; }
.res span:first-child { color: var(--ink-3); }
.res .mono { font-size: 12px; color: var(--ink-2); text-align: right; font-variant-numeric: tabular-nums; }
.bar { height: 5px; border-radius: 3px; background: var(--line); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--ink-2); border-radius: 3px; }

/* transcript, files, timeline, report, terminal, machine */
.x-tr { list-style: none; margin: 0 auto; padding: 0; max-width: 860px; display: flex; flex-direction: column; gap: 10px; }
.x-msg { padding: 2px 0; }
.x-msg-who { display: flex; gap: 10px; align-items: baseline; font-size: 12.5px; font-weight: 600; margin-bottom: 2px; }
.x-msg-who span { font: 12px var(--mono); color: var(--ink-3); font-weight: 400; }
.x-msg-note { border: 1px solid var(--line); border-radius: 5px; padding: 0 5px; }
.x-msg p { margin: 0; font-size: 14.5px; max-width: 72ch; }
.x-msg[data-role="user"] { background: var(--sunk); border-radius: 10px; padding: 10px 14px; }
.x-tc details, .x-reason details { border: 1px solid var(--line); border-radius: 9px; background: var(--panel); }
.x-tc summary, .x-reason summary { display: flex; gap: 10px; align-items: center; padding: 7px 12px; cursor: pointer; font: 12.5px var(--mono); list-style: none; min-width: 0; }
.x-tc summary::-webkit-details-marker, .x-reason summary::-webkit-details-marker { display: none; }
.x-tc-t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink); min-width: 0; flex: 1; }
.x-tc-took { color: var(--ink-3); flex: none; }
.x-tc-took.bad { color: var(--bad); }
.x-tc pre { margin: 0; padding: 10px 12px; border-top: 1px solid var(--line-2); font: 12px/1.55 var(--mono); overflow-x: auto; color: var(--ink-2); background: var(--sunk); border-radius: 0 0 9px 9px; }
.x-reason summary { font-family: var(--sans); color: var(--ink-3); }
.x-reason p { margin: 0; padding: 0 12px 10px; color: var(--ink-2); font-size: 13.5px; }

.x-files { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 0; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; min-height: 420px; }
.x-tree { list-style: none; margin: 0; padding: 8px; background: var(--sunk); border-right: 1px solid var(--line); font: 12.5px var(--mono); }
.x-dir { padding: 8px 8px 2px; color: var(--ink-3); }
.x-file { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 4px 8px; border-radius: 6px; font: inherit; color: var(--ink-2); }
.x-file.in { padding-left: 20px; }
.x-file:hover { background: var(--hover); }
.x-file[aria-current="true"] { background: var(--panel); color: var(--ink); box-shadow: var(--shadow); }
.x-view { min-width: 0; display: flex; flex-direction: column; }
.x-view-head { display: flex; justify-content: space-between; padding: 9px 14px; border-bottom: 1px solid var(--line); font: 12.5px var(--mono); color: var(--ink-2); }
.x-view pre { margin: 0; padding: 14px; font: 12.5px/1.6 var(--mono); overflow: auto; white-space: pre-wrap; }

.x-tl { list-style: none; margin: 0; padding: 0; max-width: 860px; }
.x-tl li { display: grid; grid-template-columns: 76px 52px minmax(0, 1fr); gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--line-2); font-size: 13.5px; }
.x-tl-time { font: 12px var(--mono); color: var(--ink-3); padding-top: 2px; }
.x-tl-actor { font-size: 12px; color: var(--ink-3); padding-top: 1px; }
.x-tl li[data-actor="user"] .x-tl-actor { color: var(--accent); }
.x-tl li[data-actor="agent"] .x-tl-actor { color: var(--k-task); }

.x-report { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 40px; }
.x-report > .x-md h2 { font-size: 16px; margin: 22px 0 6px; }
.x-report > .x-md h2:first-child { font-size: 22px; margin-top: 0; }
.x-triage { display: flex; flex-direction: column; gap: 8px; align-self: start; position: sticky; top: 0; padding: 16px; border: 1px solid var(--line); border-radius: 12px; background: var(--sunk); }
.x-triage h3 { margin: 0 0 4px; font-size: 14px; }
.x-triage label { font-size: 12.5px; color: var(--ink-2); }
.x-triage select, .x-triage textarea, .x-form input, .x-form select { width: 100%; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); padding: 7px 10px; font-size: 13.5px; }
.x-triage textarea { font: 12.5px/1.5 var(--mono); resize: vertical; }
.x-checkrow { display: flex; gap: 8px; align-items: center; color: var(--ink) !important; font-size: 13px !important; }
.x-triage .x-primary, .x-form .x-btn { height: 34px; border-radius: 8px; font-weight: 500; font-size: 13px; padding: 0 14px; border: 1px solid var(--line); background: var(--panel); }
.x-triage .x-primary { border-color: var(--ink); }

.x-term pre { margin: 0; padding: 16px 18px; border-radius: 10px; background: #0d0f12; color: #d3d6db; font: 13px/1.6 var(--mono); min-height: 360px; }
.x-caret { display: inline-block; width: 8px; height: 15px; background: #d3d6db; vertical-align: -2px; animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.x-machine { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 40px; max-width: 980px; }
.x-meters { display: flex; flex-direction: column; gap: 16px; }
.x-meter-top { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 6px; }
.x-meter-top span:last-child { font-family: var(--mono); font-size: 12.5px; color: var(--ink-2); }
.x-meter-bar { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; }
.x-meter-bar i { display: block; height: 100%; background: var(--accent); border-radius: 4px; }
.x-kv { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 8px 12px; margin: 0; font-size: 13.5px; }
.x-kv dt { color: var(--ink-3); }
.x-kv dd { margin: 0; font-family: var(--mono); font-size: 12.5px; overflow-wrap: anywhere; }

/* composer */
.composer { padding: 10px 32px 16px; border-top: 1px solid var(--line-2); background: var(--panel); }
.cbox { border: 1px solid var(--line); border-radius: 12px; background: var(--panel); box-shadow: var(--shadow); padding: 8px 8px 8px 14px; display: flex; align-items: flex-end; gap: 8px; }
.cbox:focus-within { border-color: var(--ink-3); }
.cbox textarea { flex: 1; border: 0; outline: 0; resize: none; background: none; min-height: 32px; max-height: 160px; padding: 6px 0; line-height: 1.45; }
.cbox textarea:disabled { color: var(--ink-3); }
.cbox .chip { height: 30px; padding: 0 10px; border-radius: 7px; border: 1px solid var(--line); background: var(--sunk); font-size: 12.5px; color: var(--ink-2); white-space: nowrap; }
.cbox .chip:hover { color: var(--ink); }
.send { width: 32px; height: 32px; border-radius: 8px; border: 0; background: var(--ink); color: var(--panel); display: grid; place-items: center; flex: none; }
.send:disabled { background: var(--line); color: var(--ink-3); cursor: default; }
.c-hint { display: flex; justify-content: space-between; font-size: 12px; color: var(--ink-3); padding: 6px 2px 0; }

/* pages that are not part of the mockup, activity, new run */
.page-h { display: flex; align-items: center; gap: 12px; padding: 22px 32px 0; }
.page-h h1 { margin: 0; font-size: 22px; font-weight: 600; letter-spacing: -.015em; }
.stub { display: grid; place-items: center; height: 60%; color: var(--ink-3); }
.feed { list-style: none; margin: 0; padding: 0; font-size: 13px; }
.feed li { display: grid; grid-template-columns: 72px 170px 52px minmax(0, 1fr); gap: 12px; padding: 6px 0; border-bottom: 1px solid var(--line-2); align-items: center; }
.feed .t { font: 12px var(--mono); color: var(--ink-3); }
.feed .r { display: flex; align-items: center; gap: 7px; overflow: hidden; white-space: nowrap; }
.feed .r i { width: 8px; height: 8px; border-radius: 2px; flex: none; }
.feed .c { font: 12.5px var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink-2); }
.x-form { display: grid; grid-template-columns: 1fr 1fr; gap: 16px 18px; max-width: 760px; }
.x-form .wide { grid-column: 1 / -1; }
.x-field { display: flex; flex-direction: column; gap: 6px; min-width: 0; border: 0; padding: 0; margin: 0; }
.x-field label, .x-field legend { font-size: 12.5px; font-weight: 500; color: var(--ink-2); padding: 0; }
.x-form input, .x-form select { height: 36px; }
.x-seg { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.x-seg legend { margin-bottom: 6px; }
.x-seg label { position: relative; }
.x-seg input { position: absolute; opacity: 0; }
.x-seg span { display: flex; flex-direction: column; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; cursor: pointer; }
.x-seg span small { font: 12px var(--mono); color: var(--ink-3); }
.x-seg input:checked + span { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
.x-seg input:focus-visible + span { outline: 2px solid var(--accent); }
.x-preview summary { cursor: pointer; font-size: 13px; color: var(--ink-2); }
.x-preview pre { margin: 8px 0 0; padding: 12px 14px; border-radius: 10px; background: var(--sunk); border: 1px solid var(--line-2); font: 12.5px/1.6 var(--mono); white-space: pre-wrap; }
.x-form-btns { display: flex; justify-content: flex-end; gap: 8px; }
.x-form .x-primary { background: var(--ink); color: var(--panel); border-color: var(--ink); }

/* overlays */
.x-menu { position: fixed; z-index: 800; min-width: 232px; padding: 5px; border-radius: 10px; background: var(--panel); box-shadow: var(--pop); }
.x-menu-item { display: grid; grid-template-columns: 16px 1fr auto; gap: 6px; align-items: center; width: 100%; height: 32px; padding: 0 10px 0 6px; border: 0; border-radius: 6px; background: none; text-align: left; font-size: 13px; }
.x-menu-item:hover, .x-menu-item:focus-visible { background: var(--hover); outline: 0; }
.x-menu-item:disabled { color: var(--ink-3); opacity: .6; cursor: default; background: none; }
.x-menu-item.danger { color: var(--bad); }
.x-menu-check { color: var(--accent); font-size: 12px; }
.x-menu-hint { color: var(--ink-3); font-size: 12px; font-family: var(--mono); max-width: 170px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.x-menu-sep { height: 1px; background: var(--line-2); margin: 4px 0; }
.x-menu-head { padding: 6px 10px 4px 28px; font-size: 12px; color: var(--ink-3); }
.x-pal, .x-dialog-scrim { position: fixed; inset: 0; z-index: 850; background: rgba(10, 12, 16, .32); display: flex; justify-content: center; align-items: flex-start; padding: 12vh 16px 0; }
.x-pal-box { width: min(600px, 100%); background: var(--panel); border-radius: 14px; box-shadow: var(--pop); overflow: hidden; }
.x-pal-input { width: 100%; height: 52px; border: 0; border-bottom: 1px solid var(--line); padding: 0 18px; font-size: 15.5px; background: none; outline: 0; }
.x-pal-list { max-height: 380px; overflow-y: auto; padding: 6px; }
.x-pal-group { padding: 8px 12px 4px; font-size: 12px; color: var(--ink-3); }
.x-pal-item { display: flex; align-items: center; gap: 10px; width: 100%; height: 36px; padding: 0 12px; border: 0; border-radius: 8px; background: none; text-align: left; }
.x-pal-item[aria-selected="true"] { background: var(--hover); }
.x-pal-label { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.x-pal-hint { font: 12px var(--mono); color: var(--ink-3); }
.x-pal-none { padding: 18px; color: var(--ink-3); }
.x-pal-foot { display: flex; gap: 16px; padding: 9px 16px; border-top: 1px solid var(--line-2); font-size: 12px; color: var(--ink-3); }
.x-pal-foot kbd { margin-right: 3px; }
.x-dialog { width: min(440px, 100%); background: var(--panel); border-radius: 14px; box-shadow: var(--pop); padding: 20px 22px 18px; margin-top: 8vh; }
.x-dialog h2 { margin: 0 0 6px; font-size: 16px; }
.x-dialog p { margin: 0 0 14px; color: var(--ink-2); }
.x-dialog .x-checkrow { margin-bottom: 14px; }
.x-dialog-btns { display: flex; justify-content: flex-end; gap: 8px; }
.x-btn { height: 34px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); font-weight: 500; font-size: 13px; }
.x-danger { background: var(--bad); border-color: var(--bad); color: #fff; }
.x-toasts { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 900; display: flex; flex-direction: column; gap: 6px; align-items: flex-end; }
.x-toast { padding: 9px 14px; border-radius: 9px; background: var(--ink); color: var(--panel); font-size: 13px; box-shadow: var(--pop); transition: opacity .3s, transform .3s; }
.x-toast.out { opacity: 0; transform: translateY(6px); }

@media (prefers-reduced-motion: reduce) { *, *::after { animation: none !important; transition: none !important; } }
@media (max-width: 1100px) { .ov { grid-template-columns: minmax(0, 1fr); } .ov-side { border-left: 0; border-top: 1px solid var(--line-2); } .x-report { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 820px) {
  body { overflow: auto; }
  .app { grid-template-columns: minmax(0, 1fr); height: auto; }
  .side { border-right: 0; border-bottom: 1px solid var(--line); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .runs { max-height: 300px; }
  .rh, .tabs, .composer, .pad, .page-h { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .ov-main, .ov-side { padding-left: 16px; padding-right: 16px; }
  .rh-top { flex-direction: column; gap: 10px; }
  .x-files, .x-machine, .x-form { grid-template-columns: minmax(0, 1fr); }
  .feed li { grid-template-columns: 64px minmax(0, 1fr); }
  .feed li .k, .feed li .c { grid-column: 2; }
}
</style>
</head>
<body>
<div class="app">
  <aside class="side" aria-label="Runs and navigation">
    <div class="brand">
      <svg class="mark" viewBox="0 0 18 18" aria-hidden="true"><g fill="currentColor"><rect x="0" y="0" width="5" height="5" rx="1"/><rect x="6.5" y="0" width="5" height="5" rx="1" opacity=".35"/><rect x="13" y="0" width="5" height="5" rx="1"/><rect x="0" y="6.5" width="5" height="5" rx="1" opacity=".35"/><rect x="6.5" y="6.5" width="5" height="5" rx="1" style="fill:var(--accent)"/><rect x="13" y="6.5" width="5" height="5" rx="1" opacity=".35"/><rect x="0" y="13" width="5" height="5" rx="1"/><rect x="6.5" y="13" width="5" height="5" rx="1" opacity=".35"/><rect x="13" y="13" width="5" height="5" rx="1"/></g></svg>
      <b>Pixel</b><span class="host">local</span>
      <button class="icon-btn" id="search" aria-label="Search and commands (⌘K)" title="Search and commands (⌘K)"><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button>
    </div>
    <button class="new-btn" id="newrun"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>New run<kbd>N</kbd></button>
    <dl class="fleet" id="fleet"></dl>
    <div class="runs" id="runlist"></div>
    <nav class="pages" id="pages" aria-label="Pages"></nav>
    <div class="conn"><i></i>connected · 127.0.0.1:7701</div>
  </aside>
  <main class="main" id="main">
    <div id="view" style="display:contents"></div>
    <form class="composer" id="composer">
      <div class="cbox">
        <textarea id="msg" rows="1" placeholder="Message the agent" aria-label="Message the agent"></textarea>
        <button type="button" class="chip" id="cont">Send continue</button>
        <button type="submit" class="send" id="send" aria-label="Send" disabled><svg class="i" viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
      </div>
      <div class="c-hint"><span id="c-left">Goes to the main agent as your next message</span><span>⌘↵ to send · j/k next run · ⌘K commands</span></div>
    </form>
  </main>
</div>
<script>
(() => {
  const { runs, find, name, repoShort, fmt, r: R } = PX;
  const $ = (s, el = document) => el.querySelector(s);
  const I = {
    pause: '<path d="M9 5v14M15 5v14"/>', play: '<path d="M7 5l12 7-12 7z"/>', stop: '<rect x="6" y="6" width="12" height="12" rx="1.5"/>',
    more: '<circle cx="5" cy="12" r="1.2" fill="currentColor"/><circle cx="12" cy="12" r="1.2" fill="currentColor"/><circle cx="19" cy="12" r="1.2" fill="currentColor"/>',
    chev: '<path d="m6 9 6 6 6-6"/>', ext: '<path d="M14 4h6v6M20 4l-9 9M18 14v6H4V6h6"/>', retry: '<path d="M20 12a8 8 0 1 1-2.3-5.6M20 4v5h-5"/>',
    activity: '<path d="M3 12h4l3-8 4 16 3-8h4"/>', models: '<path d="M4 18a8 8 0 1 1 16 0"/><path d="m12 18 4-6"/>', stats: '<path d="M5 20V11M11 20V5M17 20v-6M3 20h18"/>',
    knowledge: '<path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h11"/>', templates: '<path d="M14 3H6v18h12V7z"/><path d="M14 3v4h4M9 13h6M9 17h4"/>',
    settings: '<path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/>',
  };
  const icon = (n) => `<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${I[n]}</svg>`;

  const S = { sel: null, tab: "overview", page: "runs", pmode: "text", file: null, seenNow: {} };
  try { S.tab = localStorage.getItem("pixel-a-tab") || "overview"; } catch {}
  const statusOf = (r) => (r.question ? "asking" : r.status);
  const STATUS = { running: "Running", asking: "Waiting for you", recovering: "Recovering", preparing: "Preparing", paused: "Paused", stopped: "Stopped", failed: "Failed", done: "Report ready", triaged: "Triaged" };

  const groups = () => [
    { id: "needs", label: "Needs you", runs: runs.filter((r) => PX.needsYou(r)) },
    { id: "live", label: "Running", runs: runs.filter((r) => !PX.needsYou(r) && ["running", "recovering", "preparing", "paused"].includes(r.status)) },
    { id: "triage", label: "To triage", runs: runs.filter((r) => r.status === "done") },
    { id: "done", label: "Done", runs: runs.filter((r) => r.status === "triaged") },
  ].filter((g) => g.runs.length);
  const order = () => groups().flatMap((g) => g.runs);

  /* ---------- sidebar ---------- */
  function line(r) {
    if (r.question) return `<span class="ln warn">Asking: ${fmt.esc(r.question.text)}</span>`;
    if (r.status === "failed") return `<span class="ln bad">${fmt.esc(r.detail)}</span>`;
    if (r.status === "recovering" || r.status === "preparing") return `<span class="ln warn">${fmt.esc(r.detail)}</span>`;
    if (r.status === "paused") return `<span class="ln plain">Paused by you</span>`;
    if (r.status === "stopped") return `<span class="ln plain">Stopped · resumable</span>`;
    if (r.status === "done") return `<span class="ln plain">Report ready · ${fmt.ago(r.finished)}</span>`;
    if (r.status === "triaged") return `<span class="ln plain">Triaged · ${fmt.esc(r.verdict)}</span>`;
    const ev = r.log[r.log.length - 1];
    return ev ? `<span class="ln"><span class="t x-tool" data-kind="${ev.kind}">${fmt.esc(ev.tool)}</span>${fmt.esc(ev.text)}</span>` : `<span class="ln plain">thinking…</span>`;
  }
  function item(r) {
    const s = statusOf(r);
    const t = r.finished ? fmt.dur(r.finished - r.started) : fmt.dur(Date.now() - r.started);
    return `<li><button class="ri" data-run="${r.id}" aria-current="${r.id === S.sel && S.page === "runs"}"><span class="x-dot ${r.agent === "working" ? "busy" : ""}" data-s="${s}"></span><span class="nm"><span>${fmt.esc(name(r))}</span>${r.unseen ? '<i class="unseen" title="PROGRESS.md changed since you last looked"></i>' : ""}</span><span class="tm">${t}</span><span data-line="${r.id}" style="display:contents">${line(r)}</span></button></li>`;
  }
  function renderSide() {
    $("#runlist").innerHTML = groups().map((g) => `<section class="grp" aria-label="${g.label}"><div class="grp-h"><span>${g.label}</span><span>${g.runs.length}</span></div><ul>${g.runs.map(item).join("")}</ul></section>`).join("");
    $("#pages").innerHTML = [["Activity", "activity"], ["Models", "models"], ["Stats", "stats"], ["Knowledge", "knowledge"], ["Templates", "templates"], ["Settings", "settings"]]
      .map(([l, i]) => `<button data-page="${l}" aria-current="${S.page === l ? "page" : "false"}">${icon(i)}${l}</button>`).join("");
    renderFleet();
  }
  function renderFleet() {
    const f = PX.fleet();
    const hist = Array.from({ length: 90 }, (_, i) => runs.reduce((a, r) => a + (r.tpsHist[i] || 0), 0)).slice(-40);
    $("#fleet").innerHTML = `<dt>Output</dt><dd><b>${f.tps}</b> tok/s ${R.spark(hist, 70, 16)}</dd>
      <dt>Today</dt><dd><b>${fmt.money(f.spend)}</b>→ ${fmt.money(f.projected)} · ${fmt.tok(f.tokensToday)}</dd>
      <dt>Memory</dt><dd><b>${f.memUsed.toFixed(1)}</b>/ ${f.memTotal} GB <span class="membar" title="${f.mem.map((m) => `${m.run ? name(m.run) : m.label} ${m.gb} GB`).join(" · ")}">${f.mem.map((m) => `<i style="width:${(m.gb / f.memTotal) * 100}%;background:${m.run ? `var(--r${m.run.hue})` : "var(--ink-3)"}"></i>`).join("")}</span></dd>`;
  }

  /* ---------- run view ---------- */
  function facts(r) {
    const total = r.tokens.in + r.tokens.out;
    return `<dl class="facts">
      <div><dt>Model</dt><dd><button class="fact-btn" id="f-model" aria-haspopup="menu">${fmt.esc(fmt.shortModel(r.model))} <small>${r.variant}</small>${icon("chev")}</button></dd></div>
      <div><dt>Key</dt><dd><button class="fact-btn" id="f-key" aria-haspopup="menu">${fmt.esc(r.key)}${icon("chev")}</button><small>${r.failover ? "failover on" : "no failover"}</small></dd></div>
      <div><dt>Tokens</dt><dd id="f-tok">${fmt.tok(total)} <small>${fmt.tok(r.tokens.cache)} cached</small></dd></div>
      <div><dt>Cost</dt><dd id="f-cost">${fmt.money(r.cost)}</dd></div>
      <div><dt>Context</dt><dd>${fmt.tok(r.ctx)} <span class="gauge" title="${Math.round((r.ctx / r.ctxMax) * 100)}% of ${fmt.tok(r.ctxMax)}"><i style="width:${(r.ctx / r.ctxMax) * 100}%"></i></span></dd></div>
      <div><dt>Machine</dt><dd>${r.machine.cpu} CPU · ${r.machine.mem} GiB <small id="f-cpu">${r.machine.cpuPct}% CPU</small></dd></div>
    </dl>`;
  }
  function actions(r) {
    const b = [];
    if (r.status === "failed") b.push(`<button class="btn primary" data-act="retry">${icon("retry")}Retry</button>`);
    else if (r.status === "done") b.push(`<button class="btn primary" data-tab="report">Triage report</button>`);
    else if (r.status === "paused" || r.status === "stopped") b.push(`<button class="btn primary" data-act="resume">${icon("play")}Resume</button>`);
    else if (["running", "recovering"].includes(r.status)) b.push(`<button class="btn" data-act="pause">${icon("pause")}Pause</button>`, `<button class="btn danger-t" data-act="stop">${icon("stop")}Stop</button>`);
    b.push(`<button class="btn icon" id="more" aria-label="More actions" aria-haspopup="menu">${icon("more")}</button>`);
    return b.join("");
  }
  function sub(r) {
    if (r.question) return `asked ${fmt.ago(r.question.at)}`;
    const w = PX.working(r), n = r.agents.length;
    if (r.status === "running") return w ? `${w} of ${n} agents working` : r.agent === "waiting" ? "waiting on subagents" : "thinking";
    if (r.finished) return `finished ${fmt.ago(r.finished)}, ran ${fmt.dur(r.finished - r.started)}`;
    return "";
  }
  function header(r) {
    const s = statusOf(r);
    const notice = r.status === "failed" ? `<div class="notice bad">${fmt.esc(r.detail)}</div>` : r.status === "recovering" || r.status === "preparing" ? `<div class="notice">${fmt.esc(r.detail)}</div>` : "";
    return `<header class="rh">
      <div class="rh-top">
        <div class="rh-title"><h1 id="rname" title="Double-click to rename">${fmt.esc(name(r))}</h1><span class="pill" data-s="${s}"><span class="x-dot" data-s="${s}"></span>${STATUS[s]}</span><span class="rh-sub">${sub(r)}</span></div>
        <div class="rh-actions">${actions(r)}</div>
      </div>
      <div class="rh-meta"><a href="https://${fmt.esc(r.repo)}" target="_blank" rel="noreferrer">${fmt.esc(repoShort(r))}${icon("ext").replace('class="i"', 'class="i" style="width:12px;height:12px"')}</a><span class="mono">${fmt.esc(r.ref)}${r.commit ? ` @ ${r.commit.slice(0, 7)}` : ""}</span>${r.lang ? `<span class="sep">/</span><span>${r.lang}</span>` : ""}<span class="sep">/</span><span>started ${fmt.ago(r.started)}</span><span class="sep">/</span><span>${fmt.esc(r.template)}</span>${r.label ? `<span class="sep">/</span><span class="mono">${r.id}</span>` : ""}</div>
      ${notice}
      ${facts(r)}
    </header>`;
  }
  const TABS = [["overview", "Overview"], ["transcript", "Transcript"], ["files", "Files"], ["timeline", "Timeline"], ["report", "Report"], ["terminal", "Terminal"], ["machine", "Machine"]];
  function tabs(r) {
    return `<nav class="tabs" role="tablist">${TABS.map(([id, l]) => {
      const badge = id === "overview" && r.question ? '<span class="badge warn">●</span>' : id === "report" && r.report ? `<span class="badge">${r.status === "triaged" ? "✓" : "●"}</span>` : "";
      return `<button role="tab" data-tab="${id}" aria-selected="${S.tab === id}">${l}${badge}</button>`;
    }).join("")}</nav>`;
  }
  function overview(r) {
    const unseen = S.seenNow[r.id];
    const prog = r.progress
      ? `<section><div class="sec-h"><h2>Progress</h2><span class="meta">updated ${fmt.ago(r.progressAt)}</span>${unseen ? `<span class="delta"><span class="a">+${unseen.add}</span>${unseen.del ? ` <span class="d">−${unseen.del}</span>` : ""} <span class="meta">since you looked</span></span>` : ""}
          <div class="right"><div class="seg" role="group" aria-label="Progress view"><button data-pmode="text" aria-pressed="${S.pmode === "text"}">Text</button><button data-pmode="changes" aria-pressed="${S.pmode === "changes"}">Changes</button></div>
          <select class="vsel" aria-label="Version" id="pver"><option>Latest · ${new Date(r.progressAt).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })}</option><option>v13 · 14:02</option><option>v12 · 13:21</option></select></div></div>
          ${R.progress(r, S.pmode)}</section>`
      : `<section><div class="sec-h"><h2>Progress</h2></div><div class="x-empty">No PROGRESS.md yet.</div></section>`;
    const res = r.machine;
    return `<div class="ov">
      <div class="ov-main">${R.question(r)}${prog}</div>
      <aside class="ov-side">
        <section><div class="sec-h"><h2>Agents</h2><span class="meta">${r.agents.length} total</span></div>${R.agents(r)}</section>
        <section><div class="sec-h"><h2>Last 60 minutes</h2></div><div id="lanes">${R.lanes(r)}</div>${R.legend()}</section>
        <section><div class="sec-h"><h2>Todos</h2><span class="meta">${r.todos.filter((t) => t[0] === "completed").length} of ${r.todos.length} done</span></div>${R.todos(r)}</section>
        <section><div class="sec-h"><h2>Resources</h2></div><div class="res">
          <span>CPU</span><div class="bar"><i style="width:${res.cpuPct}%"></i></div><span class="mono">${res.cpuPct}%</span>
          <span>Memory</span><div class="bar"><i style="width:${(res.memUsed / res.mem) * 100}%"></i></div><span class="mono">${res.memUsed} / ${res.mem} GiB</span>
          <span>Disk</span><div class="bar"><i style="width:${(res.diskUsed / res.disk) * 100}%"></i></div><span class="mono">${res.diskUsed} / ${res.disk} GiB</span>
        </div></section>
        <section><div class="sec-h"><h2>Other workbases</h2></div>${R.crossReads(r)}</section>
      </aside></div>`;
  }
  function body(r) {
    switch (S.tab) {
      case "transcript": return `<div class="pad">${R.transcript(r)}</div>`;
      case "files": return `<div class="pad">${R.files(r, S.file)}</div>`;
      case "timeline": return `<div class="pad">${R.timeline(r)}</div>`;
      case "report": return `<div class="pad">${R.report(r)}</div>`;
      case "terminal": return `<div class="pad">${R.terminal(r)}</div>`;
      case "machine": return `<div class="pad">${R.machine(r)}</div>`;
      default: return overview(r);
    }
  }
  function renderMain() {
    const view = $("#view");
    const comp = $("#composer");
    if (S.page === "new") {
      comp.hidden = true;
      view.innerHTML = `<div class="page-h"><h1>New run</h1></div><div class="body"><div class="pad">${PX.newRunForm(S.newPre || {})}</div></div>`;
      PX.bindNewRun($("#x-newrun"), (id) => openRun(id), () => openRun(S.sel || runs[0].id));
      $("#nr-repo").focus();
      return;
    }
    if (S.page === "Activity") {
      comp.hidden = true;
      view.innerHTML = `<div class="page-h"><h1>Activity</h1><span class="rh-sub">Every tool call across runs, live</span></div><div class="body"><div class="pad"><ol class="feed" id="feed">${feedRows()}</ol></div></div>`;
      return;
    }
    if (S.page !== "runs") {
      comp.hidden = true;
      view.innerHTML = `<div class="page-h"><h1>${S.page}</h1></div><div class="body"><div class="stub">Not part of this mockup. Runs, Activity and New run are.</div></div>`;
      return;
    }
    const r = find(S.sel) || order()[0];
    if (!r) { view.innerHTML = `<div class="stub">No runs.</div>`; return; }
    S.sel = r.id;
    view.innerHTML = `${header(r)}${tabs(r)}<div class="body" id="body">${body(r)}</div>`;
    comp.hidden = false;
    const live = ["running", "recovering", "paused", "stopped"].includes(r.status);
    $("#msg").disabled = !live;
    $("#msg").placeholder = live ? `Message ${name(r)}` : r.status === "failed" ? "The run has no session" : "The run has finished. Use Follow-up audit to continue the work";
    $("#cont").hidden = !live;
    $("#send").disabled = !live || !$("#msg").value.trim();
  }
  function feedRows() {
    return PX.feed.slice().reverse().slice(0, 60).map((e) => { const r = find(e.run); return `<li><span class="t">${fmt.clock(e.ts)}</span><span class="r"><i style="background:var(--r${r ? r.hue : 0})"></i>${fmt.esc(r ? name(r) : e.run)}</span><span class="k x-tool" data-kind="${e.kind}">${fmt.esc(e.tool)}</span><span class="c">${fmt.esc(e.text)}</span></li>`; }).join("");
  }
  const render = () => { renderSide(); renderMain(); };

  /* ---------- navigation ---------- */
  function openRun(id) {
    S.page = "runs";
    S.sel = id;
    S.file = null;
    const r = find(id);
    if (r && r.unseen) {
      S.seenNow[id] = r.unseen;
      setTimeout(() => PX.act(id, "seen"), 1200);
    }
    if (r && r.status === "done" && S.tab === "overview") S.tab = "report";
    render();
    $("#body") && ($("#body").scrollTop = 0);
  }
  function openPage(p) { S.page = p; render(); }
  function newRun(pre) { S.page = "new"; S.newPre = pre; render(); }
  function rename(id) {
    const h = $("#rname");
    if (!h) return;
    const r = find(id);
    h.innerHTML = `<input id="rename-in" value="${fmt.esc(name(r))}" aria-label="Run name">`;
    const inp = $("#rename-in");
    inp.focus(); inp.select();
    const done = (save) => { if (save) PX.act(id, "rename", inp.value.trim()); else render(); };
    inp.addEventListener("keydown", (e) => { if (e.key === "Enter") done(true); if (e.key === "Escape") (e.stopPropagation(), done(false)); });
    inp.addEventListener("blur", () => done(true), { once: true });
  }
  PX.ui = { current: () => (S.page === "runs" ? S.sel : null), openRun, openPage, newRun, rename, openFile: (f) => { S.file = f; $("#body").innerHTML = body(find(S.sel)); }, modelMenu: (id) => PX.modelMenu($("#f-model"), id) };

  document.addEventListener("click", (e) => {
    const t = e.target;
    const run = t.closest("[data-run]"); if (run) return openRun(run.dataset.run);
    const page = t.closest("[data-page]"); if (page) return openPage(page.dataset.page);
    const tab = t.closest("[data-tab]");
    if (tab) { S.tab = tab.dataset.tab; try { localStorage.setItem("pixel-a-tab", S.tab); } catch {} return renderMain(); }
    const pm = t.closest("[data-pmode]"); if (pm) { S.pmode = pm.dataset.pmode; return renderMain(); }
    const a = t.closest("[data-act]"); if (a) return PX.act(S.sel, a.dataset.act);
    if (t.closest("#more")) return PX.runMenu(t.closest("#more"), S.sel);
    if (t.closest("#f-model")) return PX.modelMenu(t.closest("#f-model"), S.sel);
    if (t.closest("#f-key")) return PX.keyMenu(t.closest("#f-key"), S.sel);
    if (t.closest("#search")) return PX.palette();
    if (t.closest("#newrun")) return newRun({});
    if (t.closest("#cont")) return PX.act(S.sel, "continue");
  });
  document.addEventListener("dblclick", (e) => { if (e.target.closest("#rname")) rename(S.sel); });
  const msg = $("#msg");
  msg.addEventListener("input", () => { msg.style.height = "auto"; msg.style.height = Math.min(160, msg.scrollHeight) + "px"; $("#send").disabled = !msg.value.trim(); });
  msg.addEventListener("keydown", (e) => { if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); $("#composer").requestSubmit(); } });
  $("#composer").addEventListener("submit", (e) => { e.preventDefault(); if (!msg.value.trim()) return; PX.message(S.sel, msg.value.trim()); msg.value = ""; msg.style.height = "auto"; $("#send").disabled = true; });
  document.addEventListener("keydown", (e) => {
    if (e.metaKey || e.ctrlKey || e.altKey || e.target.closest("input, textarea, select, .x-pal, .x-dialog-scrim, .x-menu")) return;
    if (e.key === "j" || e.key === "k") {
      const o = order(), i = o.findIndex((r) => r.id === S.sel);
      const n = o[(i + (e.key === "j" ? 1 : o.length - 1)) % o.length];
      if (n) { openRun(n.id); document.querySelector(`[data-run="${n.id}"]`)?.scrollIntoView({ block: "nearest" }); }
    } else if (e.key === "n" || e.key === "N") { e.preventDefault(); newRun({}); }
  });

  /* ---------- live updates ---------- */
  let lanesAt = 0;
  PX.on("tick", (ev) => {
    const r = find(ev.run);
    const slot = document.querySelector(`[data-line="${ev.run}"]`);
    if (slot && r && r.status === "running" && !r.question) slot.innerHTML = line(r);
    if (S.page === "runs" && ev.run === S.sel) {
      const a = r.agents.find((x) => x.id === ev.agent);
      const el = document.querySelector(`[data-now="${ev.run}:${ev.agent}"]`);
      if (el && a) { el.innerHTML = R.agentNow(r, a); el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash"); }
      const ft = $("#f-tok"), fc = $("#f-cost");
      if (ft) ft.innerHTML = `${fmt.tok(r.tokens.in + r.tokens.out)} <small>${fmt.tok(r.tokens.cache)} cached</small>`;
      if (fc) fc.textContent = fmt.money(r.cost);
      if (Date.now() - lanesAt > 4000 && $("#lanes")) { lanesAt = Date.now(); $("#lanes").innerHTML = R.lanes(r); }
    }
    if (S.page === "Activity" && $("#feed")) $("#feed").innerHTML = feedRows();
  });
  PX.on("rates", () => {
    renderFleet();
    const r = find(S.sel), c = $("#f-cpu");
    if (r && c) c.textContent = `${r.machine.cpuPct}% CPU`;
  });
  PX.on("minute", () => S.page === "runs" && S.tab === "overview" && $("#lanes") && ($("#lanes").innerHTML = R.lanes(find(S.sel))));
  PX.on("change", (d) => {
    if (d && d.action === "created" && d.run) { S.sel = d.run; S.page = "runs"; S.tab = "overview"; }
    if (d && d.quiet && d.action === "seen") { renderSide(); return; }
    if (d && d.quiet && d.action === "message") { if (S.tab === "transcript" || S.tab === "timeline") $("#body").innerHTML = body(find(S.sel)); return; }
    if (!find(S.sel)) S.sel = order()[0]?.id;
    const keep = $("#body")?.scrollTop || 0;
    render();
    if ($("#body")) $("#body").scrollTop = keep;
  });

  S.sel = "libpng-2026-10-14";
  openRun(S.sel);
  PX.switcher("a");
  PX.start();
})();
</script>
</body>
</html>
